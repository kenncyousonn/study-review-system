<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="知识复习">
<title>知识复习系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f7f2;color:#1a1a1a;font-size:15px;min-height:100vh}
.app{max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hidden{display:none!important}

/* NAVBAR */
.navbar{background:#fff;border-bottom:1px solid #e0e8e0;padding:0 14px;display:flex;align-items:center;height:52px;position:sticky;top:0;z-index:20;box-shadow:0 1px 4px rgba(0,0,0,0.06);gap:4px}
.nav-brand{display:flex;align-items:center;gap:7px;cursor:pointer;padding:6px 10px 6px 2px;border-radius:10px;transition:background .13s;user-select:none;flex-shrink:0}
.nav-brand:hover{background:#f0faf4}
.nav-brand:active{background:#e0f5e8}
.nav-logo{font-size:22px}
.nav-title{font-size:15px;font-weight:700;color:#1a1a1a}
.nav-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;margin-left:4px}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:6px 11px;border:none;background:transparent;font-size:13px;cursor:pointer;color:#888;border-radius:8px;font-weight:500;white-space:nowrap;flex-shrink:0}
.nav-tab.active{background:#eaf5f0;color:#2a7a4e;font-weight:600}
.nav-actions{display:flex;gap:5px;flex-shrink:0}
.nav-btn{padding:6px 10px;border:1px solid #d8d8d0;border-radius:8px;font-size:12px;cursor:pointer;background:#fff;color:#555;white-space:nowrap}
.nav-btn:hover{background:#f5f5f0}

/* BOTTOM NAV */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e8e0;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.bn-inner{display:flex;justify-content:space-around}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px 4px;cursor:pointer;border:none;background:transparent;min-width:52px}
.bn-icon{font-size:21px;line-height:1}
.bn-label{font-size:10px;color:#aaa;font-weight:500}
.bn-item.active .bn-label{color:#2a7a4e;font-weight:700}

/* CONTENT */
.content{flex:1;padding:14px 14px 80px}
.page{display:none}.page.active{display:block}

/* CATEGORIES */
.sec-title{font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:9px;margin-bottom:12px}
.cat-card{background:#fff;border:1px solid #e0e8e0;border-radius:14px;padding:14px 12px;cursor:pointer;position:relative;transition:all .15s}
.cat-card:hover{border-color:#4a9e6e;box-shadow:0 2px 10px rgba(74,158,110,.12)}
.cat-card:active{transform:scale(.97)}
.cat-del{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.07);border:none;border-radius:6px;cursor:pointer;color:#666;font-size:13px;width:22px;height:22px;display:none;align-items:center;justify-content:center}
.cat-card:hover .cat-del{display:flex}
.cat-icon{font-size:26px;margin-bottom:7px}
.cat-name{font-size:13px;font-weight:600;margin-bottom:2px}
.cat-count{font-size:12px;color:#aaa}
.add-cat-btn{border:1.5px dashed #c8dcc8;border-radius:14px;padding:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:#aaa;font-size:13px;background:transparent;width:100%}
.add-cat-btn:hover{border-color:#4a9e6e;color:#4a9e6e}

/* Q LIST */
.toolbar{display:flex;gap:7px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.sel{padding:8px 10px;border:1px solid #d0d8d0;border-radius:10px;font-size:13px;background:#fff;color:#1a1a1a;cursor:pointer;outline:none;-webkit-appearance:none}
.sel:focus{border-color:#4a9e6e}
.ml-auto{margin-left:auto;display:flex;gap:5px}
.q-list{display:flex;flex-direction:column;gap:7px}
.q-item{background:#fff;border:1px solid #e8e8e0;border-radius:12px;padding:12px;display:flex;gap:9px;align-items:flex-start}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.bmc{background:#e8f4ff;color:#2266cc}
.bfill{background:#e8f8ee;color:#1a7a45}
.q-body{flex:1;min-width:0}
.q-cat-label{font-size:11px;color:#bbb;margin-bottom:2px}
.q-text{font-size:14px;line-height:1.5;word-break:break-word}
.q-item-actions{display:flex;gap:5px;flex-shrink:0;align-items:center}
.btn-star{background:none;border:1px solid #e8d88a;border-radius:8px;cursor:pointer;font-size:14px;padding:4px 8px}
.btn-star:hover{background:#fff9e0}
.btn-del{padding:5px 10px;border:1px solid #ffd0d0;border-radius:8px;font-size:12px;cursor:pointer;background:#fff;color:#c0392b}
.btn-del:hover{background:#fff0f0}
.empty{text-align:center;padding:40px 16px;color:#ccc;font-size:14px}
.empty-icon{font-size:38px;margin-bottom:9px}

/* BUTTONS */
.btn-p{padding:10px 20px;background:#4a9e6e;color:#fff;border:none;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-p:hover{background:#3a8a5e}
.btn-p:active{background:#2f7550}
.btn-o{padding:9px 16px;border:1px solid #ccc;border-radius:11px;font-size:14px;cursor:pointer;background:#fff;color:#444}
.btn-o:hover{background:#f5f5f5}
.btn-ghost{padding:8px 13px;border:1px solid #bdd8c8;border-radius:8px;font-size:13px;cursor:pointer;background:#fff;color:#4a9e6e;font-weight:500}
.btn-ghost:hover{background:#eaf5f0}

/* FORMS */
.fr{margin-bottom:13px}
.fr label{display:block;font-size:13px;font-weight:500;color:#555;margin-bottom:5px}
input[type=text],input[type=password],textarea,select{width:100%;padding:10px 12px;border:1px solid #d0d8d0;border-radius:10px;font-size:14px;background:#fff;color:#1a1a1a;font-family:inherit;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
input[type=text]:focus,input[type=password]:focus,textarea:focus,select:focus{border-color:#4a9e6e;box-shadow:0 0 0 3px rgba(74,158,110,.1)}
textarea{resize:vertical;line-height:1.55}
.req{color:#e74c3c;margin-right:2px}
.ck-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ck-row input[type=checkbox]{width:17px;height:17px;accent-color:#4a9e6e;cursor:pointer;flex-shrink:0}
.ck-row label{font-size:14px;color:#1a1a1a;cursor:pointer}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100}
@media(min-width:520px){.modal-overlay{align-items:center;padding:16px}}
.modal-box{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px calc(28px + env(safe-area-inset-bottom));width:100%;max-width:490px;max-height:92vh;overflow-y:auto}
@media(min-width:520px){.modal-box{border-radius:18px;padding:22px}}
.modal-box h2{font-size:17px;font-weight:700;margin-bottom:14px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn-p{flex:2}.modal-actions .btn-o{flex:1}
.opt-row{display:flex;gap:7px;margin-bottom:7px;align-items:center}
.opt-row input[type=text]{flex:1}
.opt-del-btn{background:none;border:none;cursor:pointer;color:#ccc;font-size:18px;line-height:1;padding:0 3px}
.opt-del-btn:hover{color:#e74c3c}
.radio-cor{accent-color:#4a9e6e;width:18px;height:18px;flex-shrink:0;cursor:pointer}
.icon-grid{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.icon-btn{font-size:23px;background:none;border:2px solid transparent;border-radius:8px;cursor:pointer;padding:4px 5px}
.icon-btn.sel{border-color:#4a9e6e}
.add-opt-btn-sm{font-size:13px;color:#4a9e6e;background:none;border:1px dashed #b8dcc8;border-radius:8px;padding:6px 12px;cursor:pointer;margin-top:2px}
.add-opt-btn-sm:hover{background:#eaf5f0}

/* ADD PAGE */
.add-page-wrap{max-width:640px}
.add-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:10px}
.add-badge{background:#eaf5f0;color:#2a7a4e;font-size:13px;font-weight:600;padding:5px 13px;border-radius:20px;border:1px solid #b8e0cc;white-space:nowrap}
.add-card{background:#fff;border:1px solid #dde8dd;border-radius:14px;padding:18px 16px;margin-bottom:14px}
.opts-hint{font-size:12px;color:#aaa;font-weight:400}
.add-opts-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.add-opts-header label{margin-bottom:0}
.add-opt-row{display:flex;align-items:center;gap:7px;margin-bottom:8px;padding:10px 11px;border:1.5px solid #e8eee8;border-radius:10px;background:#fafcfa;transition:border-color .15s}
.add-opt-row:focus-within{border-color:#4a9e6e;background:#f5fbf7}
.add-opt-letter{font-weight:700;color:#666;font-size:14px;width:17px;flex-shrink:0;text-align:center}
.add-radio{accent-color:#4a9e6e;width:17px;height:17px;flex-shrink:0;cursor:pointer}
.add-opt-inp{flex:1;border:none;background:transparent;font-size:14px;color:#1a1a1a;font-family:inherit;outline:none;min-width:0}
.add-opt-del{background:none;border:none;cursor:pointer;font-size:16px;opacity:.35;flex-shrink:0;padding:0 3px;line-height:1}
.add-opt-del:hover{opacity:.9;color:#e74c3c}
.add-add-opt-btn{font-size:13px;color:#4a9e6e;background:none;border:1px dashed #b8dcc8;border-radius:8px;padding:8px;cursor:pointer;width:100%;margin-top:2px}
.add-add-opt-btn:hover{background:#eaf5f0}
.add-actions{display:flex;gap:9px}
.add-save-next-btn{flex:2;padding:12px;background:#4a9e6e;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.add-save-next-btn:hover{background:#3a8a5e}
.add-save-done-btn{flex:1;padding:12px;background:#f0f5f0;color:#4a7a5e;border:1px solid #c8dcc8;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer}
.add-save-done-btn:hover{background:#e0eee0}

/* QUIZ HUB */
.hub-cat-header{background:#fff;border:1px solid #dde8dd;border-radius:14px;padding:16px;margin-bottom:13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hub-cat-icon{font-size:30px;flex-shrink:0}
.hub-cat-info{flex:1;min-width:120px}
.hub-cat-name{font-size:17px;font-weight:700;margin-bottom:2px}
.hub-cat-meta{font-size:12px;color:#aaa}
.hub-cat-sel{padding:8px 10px;border:1px solid #d0d8d0;border-radius:10px;font-size:13px;background:#fff;color:#1a1a1a;cursor:pointer;outline:none;-webkit-appearance:none}
.hub-section{background:#fff;border:1px solid #e0e8e0;border-radius:14px;margin-bottom:12px;overflow:hidden}
.hub-section-title{font-size:13px;font-weight:700;color:#444;padding:13px 16px 10px}
.hub-grid{display:grid;grid-template-columns:repeat(2,1fr)}
@media(min-width:500px){.hub-grid.g3{grid-template-columns:repeat(3,1fr)}}
.hub-item{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;transition:background .12s;border-top:1px solid #f2f2ea}
.hub-item:hover{background:#f5fbf7}
.hub-item:active{background:#e8f5ee}
.hub-item-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.hi-red{background:#ffe8e8}.hi-orange{background:#fff3e0}.hi-blue{background:#e8f0ff}
.hi-green{background:#e8faf0}.hi-purple{background:#f0e8ff}.hi-teal{background:#e0f8f4}
.hub-item-body{flex:1;min-width:0}
.hub-item-name{font-size:13px;font-weight:600;margin-bottom:1px}
.hub-item-sub{font-size:11px;color:#bbb}
.hub-arr{color:#ddd;font-size:16px;flex-shrink:0}
.hub-item:hover .hub-arr{color:#4a9e6e}

/* SETUP SHEET */
.setup-overlay{background:rgba(0,0,0,.45);position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:520px){.setup-overlay{align-items:center;padding:16px}}
.setup-box{background:#fff;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:420px}
@media(min-width:520px){.setup-box{border-radius:18px;padding:24px}}
.setup-box h2{font-size:17px;font-weight:700;margin-bottom:3px}
.setup-sub{font-size:13px;color:#aaa;margin-bottom:16px}

/* QUIZ SESSION */
.quiz-layout{display:flex;gap:14px;align-items:flex-start}
.quiz-main{flex:1;min-width:0}
.quiz-sidebar{width:200px;flex-shrink:0;position:sticky;top:66px}
.quiz-bc{font-size:13px;color:#aaa;margin-bottom:10px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.quiz-bc a{color:#4a9e6e;cursor:pointer}
.quiz-bc a:hover{text-decoration:underline}
.prog-row{display:flex;justify-content:space-between;font-size:12px;color:#aaa;margin-bottom:5px}
.prog-row strong{color:#1a1a1a}
.pbar{height:5px;background:#e8f0e8;border-radius:3px;margin-bottom:14px}
.pfill{height:5px;background:#4a9e6e;border-radius:3px;transition:width .3s}
.quiz-card{background:#fff;border:1px solid #dde8dd;border-radius:14px;padding:18px 16px;margin-bottom:12px}
.q-header{display:flex;align-items:center;gap:8px;margin-bottom:13px;flex-wrap:wrap}
.q-type-tag{background:#4a9e6e;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.q-num{font-size:13px;color:#aaa}
.q-star-btn{margin-left:auto;background:none;border:none;cursor:pointer;font-size:18px;padding:2px 6px;border-radius:8px;line-height:1}
.q-star-btn:hover{background:#fff9e0}
.q-body-text{font-size:15px;line-height:1.7;font-weight:500;margin-bottom:16px;word-break:break-word}
.opts-list{display:flex;flex-direction:column;gap:8px}
.opt-btn{text-align:left;padding:12px 14px;border:1.5px solid #e0e8e0;border-radius:11px;cursor:pointer;background:#fff;font-size:14px;color:#1a1a1a;line-height:1.45;font-family:inherit;width:100%;display:flex;align-items:flex-start;gap:10px;transition:all .13s}
.opt-btn:hover:not(:disabled){border-color:#4a9e6e;background:#f0faf4}
.opt-btn:disabled{cursor:default}
.opt-key{font-weight:700;flex-shrink:0;color:#aaa;min-width:18px}
.opt-btn:hover:not(:disabled) .opt-key{color:#4a9e6e}
.opt-btn.oc{border-color:#27ae60;background:#eafaf2;color:#1a6a35}.opt-btn.oc .opt-key{color:#27ae60}
.opt-btn.ow{border-color:#e74c3c;background:#fef0ef;color:#a93226}.opt-btn.ow .opt-key{color:#e74c3c}
.fill-inp{width:100%;padding:12px 14px;border:1.5px solid #d8e8d8;border-radius:11px;font-size:15px;background:#fff;color:#1a1a1a;font-family:inherit;outline:none}
.fill-inp:focus{border-color:#4a9e6e;box-shadow:0 0 0 3px rgba(74,158,110,.1)}
.fill-inp.fc{border-color:#27ae60;background:#eafaf2;color:#1a6a35}
.fill-inp.fw{border-color:#e74c3c;background:#fef0ef;color:#a93226}
.confirm-btn{margin-top:10px;padding:10px 22px;background:#4a9e6e;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.feedback{margin-top:12px;padding:11px 14px;border-radius:10px;font-size:13px;line-height:1.5}
.feedback.ok{background:#eafaf2;color:#1a6a35;border:1px solid #b8e6cc}
.feedback.fail{background:#fef0ef;color:#a93226;border:1px solid #f5c0ba}
.quiz-nav-btns{display:flex;gap:9px;margin-top:4px}
.nav-prev,.nav-next{padding:11px 14px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;border:1.5px solid #ccdccc;flex:1;justify-content:center}
.nav-prev{background:#fff;color:#444}.nav-prev:hover{background:#f5f5f5}
.nav-next{background:#4a9e6e;color:#fff;border-color:#4a9e6e}.nav-next:hover{background:#3a8a5e}
.nav-next:disabled,.nav-prev:disabled{background:#f0f0e8;border-color:#e0e0d8;color:#bbb;cursor:default}

/* ANSWER CARD */
.ans-card{background:#fff;border:1px solid #dde8dd;border-radius:13px;padding:14px}
.ans-card-top{font-size:13px;font-weight:700;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
.ans-end{font-size:12px;color:#4a9e6e;cursor:pointer;font-weight:400}
.ans-end:hover{text-decoration:underline}
.ans-sec-label{font-size:11px;color:#aaa;margin:9px 0 5px}
.ans-grid{display:flex;flex-wrap:wrap;gap:5px}
.ans-dot{width:32px;height:32px;border-radius:8px;border:1.5px solid #d8e8d8;background:#fff;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#666;transition:all .12s}
.ans-dot:hover{border-color:#4a9e6e;color:#4a9e6e}
.ans-dot.cur{border-color:#4a9e6e;background:#4a9e6e;color:#fff}
.ans-dot.dok{border-color:#27ae60;background:#eafaf2;color:#27ae60}
.ans-dot.dfail{border-color:#e74c3c;background:#fef0ef;color:#e74c3c}
.ans-legend{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:4px;font-size:11px;color:#aaa}
.ld{width:11px;height:11px;border-radius:3px}

/* RESULT */
.result-wrap{text-align:center;padding:28px 16px;max-width:460px;margin:0 auto}
.result-emoji{font-size:52px;margin-bottom:8px}
.result-pct{font-size:54px;font-weight:800;color:#4a9e6e;line-height:1}
.result-lbl{font-size:13px;color:#aaa;margin-top:5px;margin-bottom:20px}
.stat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.stat-c{background:#fff;border:1px solid #e8e8e0;border-radius:12px;padding:13px 8px;text-align:center}
.stat-n{font-size:24px;font-weight:800;margin-bottom:2px}
.stat-l{font-size:11px;color:#aaa}
.stat-c.ok .stat-n{color:#27ae60}.stat-c.fail .stat-n{color:#e74c3c}.stat-c.total .stat-n{color:#4a9e6e}
.result-btns{display:flex;gap:9px;justify-content:center}
.result-btns button{flex:1;max-width:170px}

/* SYNC PAGE */
.settings-card{background:#fff;border:1px solid #e0e8e0;border-radius:14px;padding:18px;margin-bottom:13px}
.settings-card h3{font-size:14px;font-weight:700;margin-bottom:12px}
.setting-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.setting-row label{font-size:13px;color:#555;flex-shrink:0;min-width:90px}
.setting-row input{flex:1;min-width:100px}
.sync-status{font-size:13px;color:#555;padding:9px 12px;border-radius:8px;background:#f5f5f0;margin-top:10px;line-height:1.6}
.sync-how{font-size:12px;color:#aaa;line-height:1.7;margin-top:10px}
.sync-how code{background:#f0f0e8;padding:1px 5px;border-radius:4px;font-family:monospace;color:#555}
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.sd-ok{background:#27ae60}.sd-err{background:#e74c3c}.sd-ing{background:#f39c12;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* MOBILE */
@media(max-width:600px){
  .bottom-nav{display:block}
  .nav-tabs{display:none}
  .content{padding:12px 12px 76px}
  .quiz-layout{flex-direction:column}
  .quiz-sidebar{width:100%;position:static;order:-1}
  .cat-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .hub-grid.g3{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">

  <div class="navbar">
    <div class="nav-brand" onclick="switchTab('cats')" title="回到首页">
      <div class="nav-logo">🎓</div>
      <div class="nav-title">知识复习系统</div>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('cats')">📂 分类</button>
      <button class="nav-tab" onclick="switchTab('questions')">📝 题库</button>
      <button class="nav-tab" onclick="switchTab('add')">✏️ 录题</button>
      <button class="nav-tab" onclick="switchTab('quiz')">▶ 练习</button>

      <button class="nav-btn" onclick="exportData()">⬇ 导出</button>
      <label class="nav-btn" style="cursor:pointer">⬆ 导入<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label>
    </div>
  </div>

  <div class="content">
    <div id="pg-cats" class="page active">
      <div class="sec-title">我的分类</div>
      <div class="cat-grid" id="cat-grid"></div>
      <button class="add-cat-btn" onclick="openAddCat()">＋ 新建分类</button>
    </div>

    <div id="pg-questions" class="page hidden">
      <div class="toolbar">
        <select class="sel" id="filter-cat" onchange="renderQs()"><option value="">全部分类</option></select>
        <div class="ml-auto">
          <button class="btn-ghost" onclick="openAddQ('mc')">＋ 选择题</button>
          <button class="btn-ghost" onclick="openAddQ('fill')">＋ 填空题</button>
        </div>
      </div>
      <div class="q-list" id="q-list"></div>
    </div>

    <div id="pg-add" class="page hidden">
      <div id="add-page-inner"></div>

      <div id="quiz-setup" class="hidden"></div>

      <div id="quiz-result" class="hidden"></div>

    <div id="pg-sync" class="page hidden">
      <div id="sync-page-inner"></div>

</div>

  <div class="bn-inner">
    <button class="bn-item active" id="bn-cats" onclick="switchTab('cats')"><div class="bn-icon">📂</div><div class="bn-label">分类</div></button>
    <button class="bn-item" id="bn-questions" onclick="switchTab('questions')"><div class="bn-icon">📝</div><div class="bn-label">题库</div></button>
    <button class="bn-item" id="bn-add" onclick="switchTab('add')"><div class="bn-icon">✏️</div><div class="bn-label">录题</div></button>
    <button class="bn-item" id="bn-quiz" onclick="switchTab('quiz')"><div class="bn-icon">▶️</div><div class="bn-label">练习</div></button>
    <button class="bn-item" id="bn-sync" onclick="switchTab('sync')"><div class="bn-icon">☁️</div><div class="bn-label">同步</div></button>
  </div>

<div id="modal" style="display:none" class="modal-overlay" onclick="if(event.target===this)closeModal()"></div>

<script>
var db = JSON.parse(localStorage.getItem('kqdb3')||'{"cats":[],"questions":[]}');
if(!db.cats) db={cats:[],questions:[]};
var qz={};
var addState={savedCount:0};
var hubCat='';
var ICONS=['📘','🐍','🌿','⚙️','🎯','🔐','📊','🗄️','🌐','🔧','💡','🧪','🎨','📐','🔬','🏃','🎵','🌍'];
var TABS=['cats','questions','add','quiz','sync'];

function save(){ localStorage.setItem('kqdb3',JSON.stringify(db)); }

// ── TABS ──
function switchTab(t){
  TABS.forEach(function(n){
    var p=document.getElementById('pg-'+n);
    if(p){p.classList.toggle('active',n===t);p.classList.toggle('hidden',n!==t);}
    var bn=document.getElementById('bn-'+n);
    if(bn) bn.classList.toggle('active',n===t);
  });
  document.querySelectorAll('.nav-tab').forEach(function(b,i){b.classList.toggle('active',TABS[i]===t);});
  if(t==='cats') renderCats();
  else if(t==='questions') renderQs();
  else if(t==='add') renderAddPage();
  else if(t==='quiz') renderQuizHub();
  else if(t==='sync') renderSyncPage();
}

// ── CATEGORIES ──
function renderCats(){
  var g=document.getElementById('cat-grid');
  if(!db.cats.length){g.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📂</div>还没有分类</div>';return;}
  g.innerHTML=db.cats.map(function(c,i){
    var cnt=db.questions.filter(function(q){return q.cat===c.name;}).length;
    return '<div class="cat-card" onclick="goToQs(\''+esc(c.name)+'\')">'
      +'<button class="cat-del" onclick="event.stopPropagation();delCat('+i+')">×</button>'
      +'<div class="cat-icon">'+c.icon+'</div>'
      +'<div class="cat-name">'+esc(c.name)+'</div>'
      +'<div class="cat-count">'+cnt+' 题</div></div>';
  }).join('');
}
function goToQs(name){switchTab('questions');document.getElementById('filter-cat').value=name;renderQs();}
function delCat(i){if(!confirm('删除分类？'))return;db.cats.splice(i,1);save();renderCats();}
function openAddCat(){
  var ibts=ICONS.map(function(ic,j){return '<button class="icon-btn'+(j===0?' sel':'')+'" data-ic="'+ic+'" onclick="pickIcon(\''+ic+'\')">'+ic+'</button>';}).join('');
  showModal('<h2>新建分类</h2>'
    +'<div class="fr"><label>分类名称</label><input type="text" id="mn" placeholder="例：Python 基础"></div>'
    +'<div class="fr"><label>选择图标</label><div class="icon-grid">'+ibts+'</div><input type="text" id="mi" value="📘" style="display:none"></div>'
    +'<div class="modal-actions"><button class="btn-o" onclick="closeModal()">取消</button><button class="btn-p" onclick="addCat()">创建</button></div>');
  setTimeout(function(){var el=document.getElementById('mn');if(el)el.focus();},60);
}
function pickIcon(ic){
  document.getElementById('mi').value=ic;
  document.querySelectorAll('.icon-btn').forEach(function(b){b.classList.toggle('sel',b.dataset.ic===ic);});
}
function addCat(){
  var name=document.getElementById('mn').value.trim();
  if(!name){alert('请输入名称');return;}
  if(db.cats.find(function(c){return c.name===name;})){alert('分类已存在');return;}
  db.cats.push({name:name,icon:document.getElementById('mi').value||'📘'});
  save();closeModal();renderCats();
}

// ── QUESTIONS ──
function renderQs(){
  var cat=document.getElementById('filter-cat').value;
  var sel=document.getElementById('filter-cat');
  var prev=cat;
  sel.innerHTML='<option value="">全部分类</option>'+db.cats.map(function(c){return '<option value="'+esc(c.name)+'">'+c.icon+' '+esc(c.name)+'</option>';}).join('');
  sel.value=prev;
  var qs=cat?db.questions.filter(function(q){return q.cat===cat;}):db.questions;
  var l=document.getElementById('q-list');
  if(!qs.length){l.innerHTML='<div class="empty"><div class="empty-icon">📭</div>暂无题目</div>';return;}
  l.innerHTML=qs.map(function(q){
    var ri=db.questions.indexOf(q);
    return '<div class="q-item">'
      +'<span class="badge '+(q.type==='mc'?'bmc':'bfill')+'">'+(q.type==='mc'?'选择':'填空')+'</span>'
      +'<div class="q-body"><div class="q-cat-label">'+esc(q.cat)+(q.wrongCount?' · ❌'+q.wrongCount:'')+'</div>'
        +'<div class="q-text">'+esc(q.q)+'</div></div>'
      +'<div class="q-item-actions">'
        +'<button class="btn-star" onclick="toggleStar('+ri+')">'+(q.starred?'⭐':'☆')+'</button>'
        +'<button class="btn-del" onclick="delQ('+ri+')">删除</button>'
      +'</div></div>';
  }).join('');
}
function toggleStar(i){db.questions[i].starred=!db.questions[i].starred;save();renderQs();}
function openAddQ(type){
  if(!db.cats.length){alert('请先创建分类！');return;}
  var catOpts=db.cats.map(function(c){return '<option>'+esc(c.name)+'</option>';}).join('');
  var extra=type==='mc'
    ?'<div class="fr"><label>选项 <span class="opts-hint">（左侧单选框 = 正确答案）</span></label>'
      +'<div id="mol">'+[0,1,2,3].map(function(i){
        return '<div class="opt-row"><input type="radio" name="cor" value="'+i+'" class="radio-cor"'+(i===0?' checked':'')+'>'
          +'<input type="text" placeholder="选项 '+String.fromCharCode(65+i)+'" id="op-'+i+'">'
          +'<button class="opt-del-btn" onclick="remMOpt(this)">×</button></div>';
      }).join('')+'</div>'
      +'<button class="add-opt-btn-sm" onclick="addMOpt()">＋ 加选项</button></div>'
    :'<div class="fr"><label>参考答案</label><input type="text" id="mans" placeholder="标准答案（忽略大小写）"></div>';
  showModal('<h2>'+(type==='mc'?'添加选择题':'添加填空题')+'</h2>'
    +'<div class="fr"><label>所属分类</label><select id="mcat">'+catOpts+'</select></div>'
    +'<div class="fr"><label>题目内容</label><textarea id="mq" placeholder="在此输入题目..." rows="3"></textarea></div>'
    +extra
    +'<div class="modal-actions"><button class="btn-o" onclick="closeModal()">取消</button><button class="btn-p" onclick="saveMQ(\''+type+'\')">保存</button></div>');
}
function addMOpt(){
  var l=document.getElementById('mol');var n=l.children.length;if(n>=8)return;
  var d=document.createElement('div');d.className='opt-row';
  d.innerHTML='<input type="radio" name="cor" value="'+n+'" class="radio-cor"><input type="text" placeholder="选项 '+String.fromCharCode(65+n)+'" id="op-'+n+'"><button class="opt-del-btn" onclick="remMOpt(this)">×</button>';
  l.appendChild(d);
}
function remMOpt(btn){if(btn.parentElement.parentElement.children.length>2)btn.parentElement.remove();}
function saveMQ(type){
  var cat=document.getElementById('mcat').value;
  var q=document.getElementById('mq').value.trim();
  if(!q){alert('请输入题目');return;}
  if(type==='mc'){
    var opts=Array.from(document.querySelectorAll('#mol input[type=text]')).map(function(i){return i.value.trim();}).filter(Boolean);
    if(opts.length<2){alert('至少2个选项');return;}
    var cor=parseInt(document.querySelector('input[name=cor]:checked').value);
    if(cor>=opts.length){alert('正确答案选项为空');return;}
    db.questions.push({type:'mc',cat:cat,q:q,opts:opts,correct:cor});
  } else {
    var ans=document.getElementById('mans').value.trim();
    if(!ans){alert('请输入答案');return;}
    db.questions.push({type:'fill',cat:cat,q:q,ans:ans});
  }
  save();closeModal();renderQs();
}
function delQ(i){if(!confirm('删除？'))return;db.questions.splice(i,1);save();renderQs();}

// ── ADD PAGE ──
function renderAddPage(){
  if(!db.cats.length){
    document.getElementById('add-page-inner').innerHTML='<div class="empty"><div class="empty-icon">📂</div>请先新建分类<br><br><button class="btn-p" onclick="switchTab(\'cats\')">去新建分类</button></div>';
    return;
  }
  var catOpts=db.cats.map(function(c){return '<option value="'+esc(c.name)+'">'+c.icon+' '+esc(c.name)+'</option>';}).join('');
  document.getElementById('add-page-inner').innerHTML=
    '<div class="add-page-wrap">'
    +'<div class="add-header"><div><h2 style="font-size:16px;font-weight:700;margin-bottom:2px">录题</h2>'
      +'<div style="font-size:12px;color:#aaa">保存后自动清空，可连续录入</div></div>'
      +(addState.savedCount>0?'<div class="add-badge">✓ 已录 '+addState.savedCount+' 题</div>':'')
    +'</div>'
    +'<div class="fr"><label>所属分类</label><select id="add-cat" style="width:100%">'+catOpts+'</select></div>'
    +'<div class="add-card">'
      +'<div class="fr"><label><span class="req">*</span> 题目内容</label>'
        +'<textarea id="add-q" placeholder="在此输入题目..." rows="3"></textarea></div>'
      +'<div class="fr">'
        +'<div class="add-opts-header"><label><span class="req">*</span> 试题选项</label>'
          +'<span class="opts-hint">左侧单选框 = 正确答案</span></div>'
        +'<div id="add-ol">'
          +[0,1,2,3].map(function(i){
            return '<div class="add-opt-row">'
              +'<span class="add-opt-letter">'+String.fromCharCode(65+i)+'</span>'
              +'<input type="radio" name="add-cor" value="'+i+'" class="add-radio"'+(i===0?' checked':'')+'>'
              +'<input type="text" class="add-opt-inp" placeholder="请输入试题选项" id="aop-'+i+'">'
              +'<button class="add-opt-del" onclick="addRemOpt(this)">🗑</button></div>';
          }).join('')
        +'</div>'
        +'<button class="add-add-opt-btn" onclick="addAddOpt()">＋ 添加选项</button>'
      +'</div>'
      +'<div class="fr" style="margin-bottom:0"><label>解析 <span style="color:#bbb;font-weight:400">(选填)</span></label>'
        +'<textarea id="add-exp" placeholder="请输入解析..." rows="2"></textarea></div>'
    +'</div>'
    +'<div class="add-actions">'
      +'<button class="add-save-next-btn" onclick="saveAndContinue()">保存并继续录题</button>'
      +'<button class="add-save-done-btn" onclick="saveAndDone()">保存并完成</button>'
    +'</div></div>';
  setTimeout(function(){var el=document.getElementById('add-q');if(el)el.focus();},60);
}
function addAddOpt(){
  var l=document.getElementById('add-ol');var n=l.children.length;if(n>=8)return;
  var d=document.createElement('div');d.className='add-opt-row';
  d.innerHTML='<span class="add-opt-letter">'+String.fromCharCode(65+n)+'</span>'
    +'<input type="radio" name="add-cor" value="'+n+'" class="add-radio">'
    +'<input type="text" class="add-opt-inp" placeholder="请输入试题选项">'
    +'<button class="add-opt-del" onclick="addRemOpt(this)">🗑</button>';
  l.appendChild(d);
}
function addRemOpt(btn){
  var l=document.getElementById('add-ol');
  if(l.children.length<=2)return;
  btn.parentElement.remove();
  Array.from(l.children).forEach(function(row,i){
    row.querySelector('.add-opt-letter').textContent=String.fromCharCode(65+i);
    row.querySelector('input[type=radio]').value=i;
  });
}
function collectAddForm(){
  var cat=document.getElementById('add-cat').value;
  var q=document.getElementById('add-q').value.trim();
  if(!q){alert('请输入题目内容');document.getElementById('add-q').focus();return null;}
  var opts=Array.from(document.querySelectorAll('#add-ol .add-opt-inp')).map(function(i){return i.value.trim();});
  var filled=opts.filter(Boolean);
  if(filled.length<2){alert('至少填写 2 个选项');return null;}
  var cor=parseInt(document.querySelector('input[name=add-cor]:checked').value);
  if(!opts[cor]){alert('正确答案对应的选项为空');return null;}
  var corText=opts[cor];
  var finalOpts=opts.filter(Boolean);
  var finalCor=finalOpts.indexOf(corText);
  var exp=document.getElementById('add-exp').value.trim();
  return{type:'mc',cat:cat,q:q,opts:finalOpts,correct:finalCor,exp:exp||''};
}
function saveAndContinue(){
  var data=collectAddForm();if(!data)return;
  db.questions.push(data);save();addState.savedCount++;
  var btn=document.querySelector('.add-save-next-btn');
  if(btn){btn.textContent='✓ 已保存！';btn.style.background='#27ae60';}
  setTimeout(function(){
    var cat=document.getElementById('add-cat').value;
    renderAddPage();
    var s=document.getElementById('add-cat');if(s)s.value=cat;
    var el=document.getElementById('add-q');if(el)el.focus();
  },500);
}
function saveAndDone(){
  var data=collectAddForm();if(!data)return;
  db.questions.push(data);save();
  addState.savedCount++;
  var total=addState.savedCount;addState.savedCount=0;
  gistPush();
  alert('✓ 录题完成，共保存 '+total+' 道题！');
  switchTab('questions');
}

// ── QUIZ HUB ──
function renderQuizHub(){
  var hub=document.getElementById('quiz-hub');
  hub.classList.remove('hidden');
  document.getElementById('quiz-session').classList.add('hidden');
  document.getElementById('quiz-result').classList.add('hidden');
  document.getElementById('quiz-setup').classList.add('hidden');

  var pool=hubCat?db.questions.filter(function(q){return q.cat===hubCat;}):db.questions;
  var catIcon=hubCat?(db.cats.find(function(c){return c.name===hubCat;})||{icon:'📚'}).icon:'📚';
  var catName=hubCat||'全部题库';
  var catOpts='<option value="">全部题库</option>'+db.cats.map(function(c){
    return '<option value="'+esc(c.name)+'"'+(hubCat===c.name?' selected':'')+'>'+c.icon+' '+esc(c.name)+'</option>';
  }).join('');
  var wrongCnt=pool.filter(function(q){return q.wrongCount&&q.wrongCount>0;}).length;
  var starCnt=pool.filter(function(q){return q.starred;}).length;

  hub.innerHTML=
    '<div class="hub-cat-header">'
      +'<div class="hub-cat-icon">'+catIcon+'</div>'
      +'<div class="hub-cat-info"><div class="hub-cat-name">'+esc(catName)+'</div>'
        +'<div class="hub-cat-meta">共 '+pool.length+' 题</div></div>'
      +'<select class="hub-cat-sel" onchange="hubSetCat(this.value)">'+catOpts+'</select>'
    +'</div>'
    +'<div class="hub-section"><div class="hub-section-title">我的练习</div>'
      +'<div class="hub-grid">'
        +hitem('hi-red','❌','我的错题',wrongCnt+' 道',"launchSpecial('wrong')")
        +hitem('hi-orange','⭐','我的收藏',starCnt+' 道',"launchSpecial('star')")
      +'</div></div>'
    +'<div class="hub-section"><div class="hub-section-title">专项练习</div>'
      +'<div class="hub-grid g3">'
        +hitem('hi-blue','🔢','顺序练习','按题号顺序',"openSetup('ordered')")
        +hitem('hi-green','🔀','随机练习','随机打乱',"openSetup('random')")
        +hitem('hi-purple','📋','题型练习','按题型分类',"openSetup('type')")
      +'</div></div>';
}
function hitem(cls,icon,name,sub,onclick){
  return '<div class="hub-item" onclick="'+onclick+'">'
    +'<div class="hub-item-icon '+cls+'">'+icon+'</div>'
    +'<div class="hub-item-body"><div class="hub-item-name">'+name+'</div><div class="hub-item-sub">'+sub+'</div></div>'
    +'<span class="hub-arr">›</span></div>';
}
function hubSetCat(val){hubCat=val;renderQuizHub();}

function launchSpecial(mode){
  var pool=hubCat?db.questions.filter(function(q){return q.cat===hubCat;}):db.questions.slice();
  if(mode==='wrong') pool=pool.filter(function(q){return q.wrongCount&&q.wrongCount>0;});
  if(mode==='star')  pool=pool.filter(function(q){return q.starred;});
  if(!pool.length){alert(mode==='wrong'?'暂无错题，继续加油！':'暂无收藏，去收藏几题吧～');return;}
  pool=pool.slice().sort(function(){return Math.random()-.5;});
  beginSession(pool,mode);
}

function openSetup(mode){
  var pool=hubCat?db.questions.filter(function(q){return q.cat===hubCat;}):db.questions.slice();
  var label={ordered:'顺序练习',random:'随机练习',type:'题型练习'}[mode];
  var typeRow=mode==='type'?'<div class="fr"><label>题目类型</label><select id="qz-type" style="width:100%"><option value="">全部</option><option value="mc">仅选择题</option><option value="fill">仅填空题</option></select></div>':'';
  var shRow=mode!=='ordered'?'<div class="ck-row"><input type="checkbox" id="sh-q" checked><label for="sh-q">打乱题目顺序</label></div>':'';
  document.getElementById('quiz-setup').innerHTML=
    '<div class="setup-overlay" onclick="if(event.target===this)closeSetup()">'
    +'<div class="setup-box"><h2>'+label+'</h2>'
      +'<div class="setup-sub">'+(hubCat||'全部题库')+' · 共 '+pool.length+' 题</div>'
      +typeRow
      +'<div class="fr"><label>题目数量</label><select id="qz-cnt" style="width:100%">'
        +'<option value="5">5 题</option><option value="10" selected>10 题</option>'
        +'<option value="20">20 题</option><option value="0">全部（'+pool.length+' 题）</option>'
      +'</select></div>'
      +shRow
      +'<div class="ck-row"><input type="checkbox" id="sh-o" checked><label for="sh-o">打乱选项顺序</label></div>'
      +'<div style="display:flex;gap:9px;margin-top:16px">'
        +'<button class="btn-o" style="flex:1" onclick="closeSetup()">取消</button>'
        +'<button class="btn-p" style="flex:2" onclick="startFromSetup(\''+mode+'\')">开始练习</button>'
      +'</div></div></div>';
  document.getElementById('quiz-setup').classList.remove('hidden');
}
function closeSetup(){document.getElementById('quiz-setup').classList.add('hidden');}

function startFromSetup(mode){
  var pool=hubCat?db.questions.filter(function(q){return q.cat===hubCat;}):db.questions.slice();
  var te=document.getElementById('qz-type');
  if(te&&te.value) pool=pool.filter(function(q){return q.type===te.value;});
  if(!pool.length){alert('暂无符合条件的题目');return;}
  var shq=document.getElementById('sh-q');
  pool=shq&&shq.checked ? pool.slice().sort(function(){return Math.random()-.5;}) : pool.slice();
  var cnt=parseInt(document.getElementById('qz-cnt').value)||pool.length;
  pool=pool.slice(0,Math.min(cnt,pool.length));
  if(document.getElementById('sh-o').checked){
    pool=pool.map(function(q){
      if(q.type!=='mc') return q;
      var idx=q.opts.map(function(_,i){return i;}).sort(function(){return Math.random()-.5;});
      return Object.assign({},q,{opts:idx.map(function(i){return q.opts[i];}),correct:idx.indexOf(q.correct)});
    });
  }
  closeSetup();
  beginSession(pool,mode);
}

function beginSession(pool,mode){
  qz={qs:pool,cur:0,score:0,ans:new Array(pool.length).fill(null),mode:mode};
  document.getElementById('quiz-hub').classList.add('hidden');
  document.getElementById('quiz-session').classList.remove('hidden');
  renderSession();
}

// ── QUIZ SESSION ──
function renderSession(){
  if(qz.cur>=qz.qs.length){showResult();return;}
  var q=qz.qs[qz.cur];
  var done=qz.ans[qz.cur]!==null;
  var answN=qz.ans.filter(function(a){return a!==null;}).length;
  var pct=Math.round(answN/qz.qs.length*100);

  var qbody='';
  if(q.type==='mc'){
    qbody='<div class="opts-list">'+q.opts.map(function(o,i){
      var cls='opt-btn';
      if(done){if(i===q.correct)cls+=' oc';else if(i===qz.ans[qz.cur])cls+=' ow';}
      return '<button class="'+cls+'"'+(done?' disabled':'')+' onclick="ansMC('+i+')">'
        +'<span class="opt-key">'+String.fromCharCode(65+i)+'</span><span>'+esc(o)+'</span></button>';
    }).join('')+'</div>';
  } else {
    var fv=done?esc(qz.ans[qz.cur]):'';
    var fc=done?(qz.ans[qz.cur].trim().toLowerCase()===q.ans.trim().toLowerCase()?' fc':' fw'):'';
    qbody='<input class="fill-inp'+fc+'" id="fi" value="'+fv+'"'+(done?' disabled':'')+' placeholder="在此输入答案...">';
    if(!done) qbody+='<br><button class="confirm-btn" onclick="ansFill()">确认答案</button>';
  }

  var fb='';
  if(done){
    var ok=q.type==='mc'?qz.ans[qz.cur]===q.correct:qz.ans[qz.cur].trim().toLowerCase()===q.ans.trim().toLowerCase();
    var as=q.type==='fill'?esc(q.ans):(String.fromCharCode(65+q.correct)+'  '+esc(q.opts[q.correct]));
    fb='<div class="feedback '+(ok?'ok':'fail')+'">'+(ok?'✓ 回答正确！':'✗ 正确答案：<strong>'+as+'</strong>')
      +(q.exp?'<br><span style="color:#888">💡 '+esc(q.exp)+'</span>':'')+'</div>';
  }

  var mcDots='',fillDots='';
  qz.qs.forEach(function(qq,i){
    var cls='ans-dot';
    if(i===qz.cur)cls+=' cur';
    else if(qz.ans[i]!==null){
      var q2=qz.qs[i];
      var ok2=q2.type==='mc'?qz.ans[i]===q2.correct:qz.ans[i].trim().toLowerCase()===q2.ans.trim().toLowerCase();
      cls+=ok2?' dok':' dfail';
    }
    var dot='<button class="'+cls+'" onclick="jumpTo('+i+')">'+(i+1)+'</button>';
    if(qq.type==='mc') mcDots+=dot; else fillDots+=dot;
  });

  document.getElementById('quiz-session').innerHTML=
    '<div class="quiz-bc"><a onclick="renderQuizHub()">练习</a> › '+(hubCat||'全部')+'</div>'
    +'<div class="prog-row"><span>进度</span><strong>'+answN+' / '+qz.qs.length+'</strong></div>'
    +'<div class="pbar"><div class="pfill" style="width:'+pct+'%"></div></div>'
    +'<div class="quiz-layout">'
      +'<div class="quiz-main">'
        +'<div class="quiz-card">'
          +'<div class="q-header"><span class="q-type-tag">'+(q.type==='mc'?'单选题':'填空题')+'</span>'
            +'<span class="q-num">'+(qz.cur+1)+'/'+qz.qs.length+'</span>'
            +'<button class="q-star-btn" onclick="inSessionStar()">'+(q.starred?'⭐':'☆')+'</button></div>'
          +'<div class="q-body-text">'+esc(q.q)+'</div>'
          +qbody+fb
        +'</div>'
        +'<div class="quiz-nav-btns">'
          +'<button class="nav-prev"'+(qz.cur===0?' disabled':'')+' onclick="prevQ()">← 上一题</button>'
          +(done
            ?'<button class="nav-next" onclick="nextQ()">'+(qz.cur+1<qz.qs.length?'下一题 →':'查看结果')+'</button>'
            :'<button class="nav-next" disabled>下一题 →</button>')
        +'</div>'
      +'</div>'
      +'<div class="quiz-sidebar"><div class="ans-card">'
        +'<div class="ans-card-top">答题卡 <span class="ans-end" onclick="renderQuizHub()">结束</span></div>'
        +(mcDots?'<div class="ans-sec-label">选择题</div><div class="ans-grid">'+mcDots+'</div>':'')
        +(fillDots?'<div class="ans-sec-label">填空题</div><div class="ans-grid">'+fillDots+'</div>':'')
        +'<div class="ans-legend">'
          +'<div class="li"><div class="ld" style="background:#4a9e6e"></div>当前</div>'
          +'<div class="li"><div class="ld" style="background:#eafaf2;border:1px solid #27ae60"></div>对</div>'
          +'<div class="li"><div class="ld" style="background:#fef0ef;border:1px solid #e74c3c"></div>错</div>'
        +'</div></div></div>'
    +'</div>';

  if(q.type==='fill'&&!done){
    setTimeout(function(){
      var el=document.getElementById('fi');
      if(el){el.focus();el.onkeydown=function(e){if(e.key==='Enter')ansFill();};}
    },40);
  }
}

function inSessionStar(){
  var q=qz.qs[qz.cur];
  var orig=db.questions.find(function(x){return x.q===q.q&&x.cat===q.cat;});
  if(orig){orig.starred=!orig.starred;q.starred=orig.starred;save();}
  renderSession();
}
function ansMC(i){
  if(qz.ans[qz.cur]!==null)return;
  qz.ans[qz.cur]=i;
  var q=qz.qs[qz.cur];
  if(i===q.correct){qz.score++;}
  else{
    var orig=db.questions.find(function(x){return x.q===q.q&&x.cat===q.cat;});
    if(orig){orig.wrongCount=(orig.wrongCount||0)+1;save();}
  }
  renderSession();
}
function ansFill(){
  var v=document.getElementById('fi').value;if(!v.trim())return;
  qz.ans[qz.cur]=v;
  var q=qz.qs[qz.cur];
  if(v.trim().toLowerCase()===q.ans.trim().toLowerCase()){qz.score++;}
  else{
    var orig=db.questions.find(function(x){return x.q===q.q&&x.cat===q.cat;});
    if(orig){orig.wrongCount=(orig.wrongCount||0)+1;save();}
  }
  renderSession();
}
function jumpTo(i){qz.cur=i;renderSession();}
function prevQ(){if(qz.cur>0){qz.cur--;renderSession();}}
function nextQ(){if(qz.cur+1<qz.qs.length){qz.cur++;renderSession();}else showResult();}

function showResult(){
  document.getElementById('quiz-session').classList.add('hidden');
  var pct=Math.round(qz.score/qz.qs.length*100);
  var emoji=pct>=90?'🎉':pct>=70?'👍':pct>=50?'💪':'📖';
  document.getElementById('quiz-result').innerHTML=
    '<div class="result-wrap"><div class="result-emoji">'+emoji+'</div>'
    +'<div class="result-pct">'+pct+'%</div><div class="result-lbl">本次得分</div>'
    +'<div class="stat-cards">'
      +'<div class="stat-c ok"><div class="stat-n">'+qz.score+'</div><div class="stat-l">答对</div></div>'
      +'<div class="stat-c fail"><div class="stat-n">'+(qz.qs.length-qz.score)+'</div><div class="stat-l">答错</div></div>'
      +'<div class="stat-c total"><div class="stat-n">'+qz.qs.length+'</div><div class="stat-l">共计</div></div>'
    +'</div>'
    +'<div class="result-btns">'
      +'<button class="btn-o" onclick="renderQuizHub()">返回</button>'
      +'<button class="btn-p" onclick="replayQuiz()">再练一次</button>'
    +'</div></div>';
  document.getElementById('quiz-result').classList.remove('hidden');
  document.getElementById('quiz-hub').classList.add('hidden');
}
function replayQuiz(){
  document.getElementById('quiz-result').classList.add('hidden');
  var m=qz.mode&&['ordered','random','type'].indexOf(qz.mode)>=0?qz.mode:'random';
  openSetup(m);
}

// ── IMPORT / EXPORT ──
function exportData(){
  var b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='知识题库_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importData(inp){
  var f=inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.cats||!data.questions)throw 0;
      if(!confirm('导入 '+data.cats.length+' 个分类、'+data.questions.length+' 道题？（合并）'))return;
      var en=new Set(db.cats.map(function(c){return c.name;}));
      data.cats.forEach(function(c){if(!en.has(c.name))db.cats.push(c);});
      db.questions=db.questions.concat(data.questions);
      save();renderCats();alert('导入成功！');
    }catch(x){alert('文件格式有误');}
  };
  r.readAsText(f);inp.value='';
}

// ── GIST SYNC ──
var syncCfg=JSON.parse(localStorage.getItem('kq_sync')||'{}');

function renderSyncPage(){
  document.getElementById('sync-page-inner').innerHTML=
    '<div class="settings-card"><h3>☁ GitHub Gist 云端同步</h3>'
      +'<div class="setting-row"><label>Personal Token</label>'
        +'<input type="password" id="cfg-token" placeholder="ghp_xxxxxxxxxx" value="'+esc(syncCfg.token||'')+'"></div>'
      +'<div class="setting-row"><label>Gist ID</label>'
        +'<input type="text" id="cfg-gistid" placeholder="首次上传后自动填入" value="'+esc(syncCfg.gistId||'')+'"></div>'
      +'<div class="ck-row"><input type="checkbox" id="cfg-auto"'+(syncCfg.autoSync!==false?' checked':'')+'>'
        +'<label for="cfg-auto">保存题目时自动上传</label></div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'
        +'<button class="btn-p" onclick="saveAndPush()" style="flex:2;min-width:110px">💾 保存并上传</button>'
        +'<button class="btn-o" onclick="pullFromGist()" style="flex:1;min-width:80px">⬇ 从云端拉取</button>'
      +'</div>'
      +'<div class="sync-status" id="sync-msg">'+getSyncText()+'</div>'
      +'<div class="sync-how">'
        +'<strong>获取 Token 步骤：</strong><br>'
        +'① GitHub → Settings → Developer settings → Personal access tokens (classic)<br>'
        +'② Generate new token，勾选 <code>gist</code> 权限，复制<br>'
        +'③ 填入上方，点「保存并上传」，Gist ID 会自动填入<br>'
        +'④ 在手机上打开本页面，填入相同 Token + Gist ID，点「从云端拉取」<br><br>'
        +'<strong>图片支持：</strong>目前图片以 base64 格式内嵌到 JSON 中，单张建议不超过 300KB。'
      +'</div>'
    +'</div>'
    +'<div class="settings-card"><h3>📦 本地备份</h3>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
        +'<button class="btn-ghost" onclick="exportData()" style="flex:1;text-align:center">⬇ 导出 JSON</button>'
        +'<label class="btn-ghost" style="flex:1;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center">⬆ 导入 JSON<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label>'
      +'</div>'
    +'</div>';
}
function getSyncText(){
  if(!syncCfg.token) return '⚪ 未配置';
  if(!syncCfg.gistId) return '🟡 Token 已填写，Gist 尚未创建';
  return '🟢 已配置 · Gist: '+syncCfg.gistId.slice(0,12)+'…'+(syncCfg.lastSync?'<br>最后同步：'+new Date(syncCfg.lastSync).toLocaleString('zh-CN'):'');
}
function setSyncMsg(s){var el=document.getElementById('sync-msg');if(el)el.innerHTML=s;}

function saveAndPush(){
  syncCfg.token=(document.getElementById('cfg-token')||{}).value||'';
  syncCfg.gistId=(document.getElementById('cfg-gistid')||{}).value||'';
  syncCfg.autoSync=!!(document.getElementById('cfg-auto')||{}).checked;
  localStorage.setItem('kq_sync',JSON.stringify(syncCfg));
  if(!syncCfg.token){alert('请先填写 GitHub Token');return;}
  setSyncMsg('<span class="sync-dot sd-ing"></span>正在上传…');
  gistPush(true).then(function(ok){
    setSyncMsg(ok?'<span class="sync-dot sd-ok"></span>✓ 上传成功 · '+new Date().toLocaleString('zh-CN'):'<span class="sync-dot sd-err"></span>✗ 失败，请检查 Token');
    renderSyncPage();
  });
}
function pullFromGist(){
  syncCfg.token=(document.getElementById('cfg-token')||{}).value||syncCfg.token||'';
  syncCfg.gistId=(document.getElementById('cfg-gistid')||{}).value||syncCfg.gistId||'';
  localStorage.setItem('kq_sync',JSON.stringify(syncCfg));
  if(!syncCfg.token||!syncCfg.gistId){alert('请填写 Token 和 Gist ID');return;}
  setSyncMsg('<span class="sync-dot sd-ing"></span>正在拉取…');
  fetch('https://api.github.com/gists/'+syncCfg.gistId,{
    headers:{'Authorization':'token '+syncCfg.token,'Accept':'application/vnd.github.v3+json'}
  }).then(function(r){return r.json();}).then(function(d){
    var content=d.files&&d.files['quiz_db.json']&&d.files['quiz_db.json'].content;
    if(!content)throw new Error('文件不存在');
    var remote=JSON.parse(content);
    if(!remote.cats||!remote.questions)throw new Error('格式错误');
    if(!confirm('拉取 '+remote.cats.length+' 个分类、'+remote.questions.length+' 道题？\n⚠️ 将覆盖本地数据'))return;
    db=remote;save();renderCats();
    syncCfg.lastSync=Date.now();localStorage.setItem('kq_sync',JSON.stringify(syncCfg));
    setSyncMsg('<span class="sync-dot sd-ok"></span>✓ 拉取成功');
    renderSyncPage();
  }).catch(function(e){setSyncMsg('<span class="sync-dot sd-err"></span>✗ 失败：'+e.message);});
}
function gistPush(force){
  if(!syncCfg.token)return Promise.resolve(false);
  if(!force&&syncCfg.autoSync===false)return Promise.resolve(false);
  var url=syncCfg.gistId?'https://api.github.com/gists/'+syncCfg.gistId:'https://api.github.com/gists';
  return fetch(url,{
    method:syncCfg.gistId?'PATCH':'POST',
    headers:{'Authorization':'token '+syncCfg.token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
    body:JSON.stringify({files:{'quiz_db.json':{content:JSON.stringify(db,null,2)}},description:'知识复习系统题库',public:false})
  }).then(function(r){return r.json();}).then(function(d){
    if(d.id){syncCfg.gistId=d.id;syncCfg.lastSync=Date.now();localStorage.setItem('kq_sync',JSON.stringify(syncCfg));}
    return!!d.id;
  }).catch(function(){return false;});
}

// ── MODAL ──
function showModal(html){var m=document.getElementById('modal');m.style.display='flex';m.innerHTML='<div class="modal-box">'+html+'</div>';}
function closeModal(){document.getElementById('modal').style.display='none';}

// ── UTILS ──
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

initSample();
renderCats();
