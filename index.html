<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="知识复习">
<title>知识复习系统</title>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f7f2;color:#1a1a1a;font-size:15px;min-height:100vh}
.app{max-width:920px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hidden{display:none!important}

/* ── NAVBAR ── */
.navbar{background:#fff;border-bottom:1px solid #e0e8e0;padding:0 14px;display:flex;align-items:center;height:52px;position:sticky;top:0;z-index:20;box-shadow:0 1px 4px rgba(0,0,0,.06);gap:4px}
.nav-brand{display:flex;align-items:center;gap:7px;cursor:pointer;padding:6px 10px 6px 2px;border-radius:10px;transition:background .13s;user-select:none;flex-shrink:0}
.nav-brand:hover{background:#f0faf4}
.nav-brand:active{background:#e0f5e8}
.nav-logo{font-size:22px}
.nav-title{font-size:15px;font-weight:700;color:#1a1a1a}
.nav-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;margin-left:4px}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:6px 11px;border:none;background:transparent;font-size:13px;cursor:pointer;color:#888;border-radius:8px;font-weight:500;white-space:nowrap;flex-shrink:0}
.nav-tab.active{background:#eaf5f0;color:#2a7a4e;font-weight:600}
.nav-actions{display:flex;gap:5px;flex-shrink:0}
.nav-btn{padding:6px 10px;border:1px solid #d8d8d0;border-radius:8px;font-size:12px;cursor:pointer;background:#fff;color:#555;white-space:nowrap}
.nav-btn:hover{background:#f5f5f0}

/* ── BOTTOM NAV ── */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e8e0;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.bn-inner{display:flex;justify-content:space-around}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px 4px;cursor:pointer;border:none;background:transparent;min-width:48px}
.bn-icon{font-size:20px;line-height:1}
.bn-label{font-size:10px;color:#aaa;font-weight:500}
.bn-item.active .bn-label{color:#2a7a4e;font-weight:700}

/* ── CONTENT ── */
.content{flex:1;padding:14px 14px 80px}
.page{display:none}.page.active{display:block}
.sec-title{font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}

/* ── DB LOADING ── */
.db-loading{display:flex;align-items:center;justify-content:center;padding:60px 20px;flex-direction:column;gap:12px;color:#888;font-size:14px}
.db-spinner{width:32px;height:32px;border:3px solid #e0e8e0;border-top-color:#4a9e6e;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── CATEGORIES ── */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:9px;margin-bottom:12px}
.cat-card{background:#fff;border:1px solid #e0e8e0;border-radius:14px;padding:14px 12px;cursor:pointer;position:relative;transition:all .15s}
.cat-card:hover{border-color:#4a9e6e;box-shadow:0 2px 10px rgba(74,158,110,.12)}
.cat-card:active{transform:scale(.97)}
.cat-del{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.07);border:none;border-radius:6px;cursor:pointer;color:#666;font-size:13px;width:22px;height:22px;display:none;align-items:center;justify-content:center}
.cat-rename{position:absolute;top:7px;right:33px;background:rgba(74,158,110,.12);border:none;border-radius:6px;cursor:pointer;color:#4a9e6e;font-size:13px;width:22px;height:22px;display:none;align-items:center;justify-content:center}
.cat-card:hover .cat-del{display:flex}
.cat-card:hover .cat-rename{display:flex}
.cat-icon{font-size:26px;margin-bottom:7px}
.cat-name{font-size:13px;font-weight:600;margin-bottom:2px}
.cat-count{font-size:12px;color:#aaa}
.add-cat-btn{border:1.5px dashed #c8dcc8;border-radius:14px;padding:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:#aaa;font-size:13px;background:transparent;width:100%}
.add-cat-btn:hover{border-color:#4a9e6e;color:#4a9e6e}

/* ── QUESTION LIST ── */
.toolbar{display:flex;gap:7px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.search-box{flex:1;min-width:140px;padding:8px 12px;border:1px solid #d0d8d0;border-radius:10px;font-size:13px;background:#fff;color:#1a1a1a;outline:none;font-family:inherit}
.search-box:focus{border-color:#4a9e6e;box-shadow:0 0 0 3px rgba(74,158,110,.1)}
.sel{padding:8px 10px;border:1px solid #d0d8d0;border-radius:10px;font-size:13px;background:#fff;color:#1a1a1a;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none}
.sel:focus{border-color:#4a9e6e}
.ml-auto{margin-left:auto;display:flex;gap:5px}
.q-list{display:flex;flex-direction:column;gap:7px}
.q-item{background:#fff;border:1px solid #e8e8e0;border-radius:12px;padding:12px;display:flex;gap:9px;align-items:flex-start}
.q-item.editing{border-color:#4a9e6e;box-shadow:0 0 0 3px rgba(74,158,110,.1)}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.bmc{background:#e8f4ff;color:#2266cc}
.bfill{background:#e8f8ee;color:#1a7a45}
.q-body{flex:1;min-width:0}
.q-id{display:inline-block;font-size:10px;color:#4a9e6e;background:#eaf5f0;border:1px solid #c8e8d8;border-radius:5px;padding:1px 6px;margin-bottom:4px;font-family:monospace;letter-spacing:.3px}
.q-mastered-badge{display:inline-block;font-size:10px;color:#f39c12;background:#fff8e0;border:1px solid #f0d888;border-radius:5px;padding:1px 6px;margin-left:5px}
.q-cat-label{font-size:11px;color:#bbb;margin-bottom:3px}
.q-wrong-badge{font-size:11px;color:#c0392b;background:#fff0ef;border:1px solid #ffd0c8;border-radius:5px;padding:1px 6px;margin-left:5px}
.q-text{font-size:14px;line-height:1.6;word-break:break-word;margin-bottom:3px}
.q-text p{margin:0}
.q-text strong{font-weight:700}
.q-text em{font-style:italic}
.q-opts-preview{font-size:12px;color:#aaa;line-height:1.7;margin-top:3px}
.q-exp-preview{font-size:12px;color:#888;background:#fafaf6;border-left:3px solid #d8d8c8;padding:4px 8px;border-radius:0 6px 6px 0;margin-top:5px;line-height:1.5}
.q-item-actions{display:flex;flex-direction:column;gap:4px;flex-shrink:0;min-width:54px}
.btn-star{background:none;border:1px solid #e8d88a;border-radius:7px;cursor:pointer;font-size:13px;padding:4px 7px;text-align:center}
.btn-star:hover{background:#fff9e0}
.btn-mastered{background:none;border:1px solid #b8e6cc;border-radius:7px;cursor:pointer;font-size:12px;padding:4px 7px;text-align:center;color:#27ae60}
.btn-mastered:hover{background:#eafaf2}
.btn-mastered.on{background:#eafaf2;border-color:#27ae60}
.btn-edit{background:none;border:1px solid #bdd8c8;border-radius:7px;cursor:pointer;font-size:12px;padding:4px 7px;color:#4a9e6e;text-align:center}
.btn-edit:hover{background:#eaf5f0}
.btn-del{padding:4px 7px;border:1px solid #ffd0d0;border-radius:7px;font-size:12px;cursor:pointer;background:#fff;color:#c0392b;text-align:center}
.btn-del:hover{background:#fff0f0}
.empty{text-align:center;padding:40px 16px;color:#ccc;font-size:14px}
.empty-icon{font-size:38px;margin-bottom:9px}

/* ── INLINE EDIT ── */
.inline-edit{background:#f5fbf7;border:1.5px solid #4a9e6e;border-radius:12px;padding:13px;margin-top:10px}
.inline-edit label{display:block;font-size:12px;font-weight:600;color:#4a9e6e;margin-bottom:5px}
.inline-edit textarea,.inline-edit input[type=text]{width:100%;padding:8px 10px;border:1px solid #d0d8d0;border-radius:8px;font-size:13px;background:#fff;color:#1a1a1a;font-family:inherit;outline:none;line-height:1.5}
.inline-edit textarea:focus,.inline-edit input[type=text]:focus{border-color:#4a9e6e}
.inline-edit select{width:100%;padding:8px 10px;border:1px solid #d0d8d0;border-radius:8px;font-size:13px;background:#fff;color:#1a1a1a;cursor:pointer;outline:none;margin-bottom:8px;-webkit-appearance:none}
.inline-edit select:focus{border-color:#4a9e6e}
.inline-edit-opts{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.ie-opt-row{display:flex;align-items:center;gap:6px}
.ie-opt-row input[type=text]{flex:1;margin-bottom:0}
.ie-radio{accent-color:#4a9e6e;width:16px;height:16px;cursor:pointer;flex-shrink:0}
.ie-opt-letter{font-weight:700;font-size:13px;color:#666;width:16px;text-align:center;flex-shrink:0}
.inline-edit-btns{display:flex;gap:7px;margin-top:10px}

/* ── RICH TEXT EDITOR ── */
.rte-wrap{border:1px solid #d0d8d0;border-radius:10px;overflow:hidden;background:#fff;transition:border-color .15s}
.rte-wrap:focus-within{border-color:#4a9e6e;box-shadow:0 0 0 3px rgba(74,158,110,.1)}
.rte-toolbar{display:flex;gap:3px;flex-wrap:wrap;padding:6px 8px;background:#f8f8f4;border-bottom:1px solid #e8e8e0}
.rte-btn{padding:4px 8px;border:1px solid #d8d8d0;border-radius:6px;background:#fff;cursor:pointer;font-size:12px;color:#444;font-family:inherit;line-height:1.4;white-space:nowrap;transition:all .12s}
.rte-btn:hover{background:#eaf5f0;border-color:#4a9e6e;color:#2a7a4e}
.rte-btn.active{background:#eaf5f0;border-color:#4a9e6e;color:#2a7a4e}
.rte-editor{min-height:80px;padding:10px 12px;outline:none;font-size:14px;line-height:1.7;color:#1a1a1a;word-break:break-word;white-space:pre-wrap}
.rte-editor:empty:before{content:attr(data-placeholder);color:#aaa;pointer-events:none}
.rte-editor p{margin:0}
.rte-editor strong{font-weight:700}
.rte-editor em{font-style:italic}
.rte-editor u{text-decoration:underline}
.rte-editor sub{vertical-align:sub;font-size:.8em}
.rte-editor sup{vertical-align:super;font-size:.8em}
.rte-editor code{background:#f0f0e8;padding:1px 4px;border-radius:4px;font-family:monospace;font-size:.9em}
/* color picker hidden input */
.color-inp{width:0;height:0;opacity:0;position:absolute}

/* ── BUTTONS ── */
.btn-p{padding:10px 20px;background:#4a9e6e;color:#fff;border:none;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-p:hover{background:#3a8a5e}
.btn-p:active{background:#2f7550}
.btn-o{padding:9px 16px;border:1px solid #ccc;border-radius:11px;font-size:14px;cursor:pointer;background:#fff;color:#444}
.btn-o:hover{background:#f5f5f5}
.btn-ghost{padding:8px 13px;border:1px solid #bdd8c8;border-radius:8px;font-size:13px;cursor:pointer;background:#fff;color:#4a9e6e;font-weight:500}
.btn-ghost:hover{background:#eaf5f0}
.btn-sm-p{padding:6px 14px;background:#4a9e6e;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-sm-o{padding:6px 12px;border:1px solid #ccc;border-radius:8px;font-size:13px;cursor:pointer;background:#fff;color:#444}

/* ── FORMS ── */
.fr{margin-bottom:13px}
.fr label{display:block;font-size:13px;font-weight:500;color:#555;margin-bottom:5px}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;padding:10px 12px;border:1px solid #d0d8d0;border-radius:10px;font-size:14px;background:#fff;color:#1a1a1a;font-family:inherit;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
input[type=text]:focus,input[type=password]:focus,input[type=number]:focus,textarea:focus,select:focus{border-color:#4a9e6e;box-shadow:0 0 0 3px rgba(74,158,110,.1)}
textarea{resize:vertical;line-height:1.6}
.req{color:#e74c3c;margin-right:2px}
.ck-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ck-row input[type=checkbox]{width:17px;height:17px;accent-color:#4a9e6e;cursor:pointer;flex-shrink:0}
.ck-row label{font-size:14px;color:#1a1a1a;cursor:pointer}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100}
@media(min-width:520px){.modal-overlay{align-items:center;padding:16px}}
.modal-box{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px calc(28px + env(safe-area-inset-bottom));width:100%;max-width:490px;max-height:92vh;overflow-y:auto}
@media(min-width:520px){.modal-box{border-radius:18px;padding:22px}}
.modal-box h2{font-size:17px;font-weight:700;margin-bottom:14px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn-p{flex:2}.modal-actions .btn-o{flex:1}
.opt-row{display:flex;gap:7px;margin-bottom:7px;align-items:center}
.opt-row input[type=text]{flex:1}
.opt-del-btn{background:none;border:none;cursor:pointer;color:#ccc;font-size:18px;line-height:1;padding:0 3px}
.opt-del-btn:hover{color:#e74c3c}
.radio-cor{accent-color:#4a9e6e;width:18px;height:18px;flex-shrink:0;cursor:pointer}
.icon-grid{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;max-height:200px;overflow-y:auto;padding:4px}
.icon-btn{font-size:22px;background:none;border:2px solid transparent;border-radius:8px;cursor:pointer;padding:3px 4px;transition:border-color .12s}
.icon-btn.sel{border-color:#4a9e6e;background:#eaf5f0}
.icon-btn:hover{border-color:#bbb}
.add-opt-btn-sm{font-size:13px;color:#4a9e6e;background:none;border:1px dashed #b8dcc8;border-radius:8px;padding:6px 12px;cursor:pointer;margin-top:2px}
.add-opt-btn-sm:hover{background:#eaf5f0}

/* ── ADD PAGE ── */
.add-page-wrap{max-width:660px}
.add-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:10px}
.add-badge{background:#eaf5f0;color:#2a7a4e;font-size:13px;font-weight:600;padding:5px 13px;border-radius:20px;border:1px solid #b8e0cc;white-space:nowrap}
.add-card{background:#fff;border:1px solid #dde8dd;border-radius:14px;padding:18px 16px;margin-bottom:14px}
.opts-hint{font-size:12px;color:#aaa;font-weight:400}
.add-opts-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.add-opts-header label{margin-bottom:0}
.add-opt-row{display:flex;align-items:center;gap:7px;margin-bottom:8px;padding:10px 11px;border:1.5px solid #e8eee8;border-radius:10px;background:#fafcfa;transition:border-color .15s}
.add-opt-row:focus-within{border-color:#4a9e6e;background:#f5fbf7}
.add-opt-letter{font-weight:700;color:#666;font-size:14px;width:17px;flex-shrink:0;text-align:center}
.add-radio{accent-color:#4a9e6e;width:17px;height:17px;flex-shrink:0;cursor:pointer}
.add-opt-inp{flex:1;border:none;background:transparent;font-size:14px;color:#1a1a1a;font-family:inherit;outline:none;min-width:0}
.add-opt-del{background:none;border:none;cursor:pointer;font-size:16px;opacity:.35;flex-shrink:0;padding:0 3px;line-height:1}
.add-opt-del:hover{opacity:.9;color:#e74c3c}
.add-add-opt-btn{font-size:13px;color:#4a9e6e;background:none;border:1px dashed #b8dcc8;border-radius:8px;padding:8px;cursor:pointer;width:100%;margin-top:2px}
.add-add-opt-btn:hover{background:#eaf5f0}
.add-actions{display:flex;gap:9px}
.add-save-next-btn{flex:2;padding:12px;background:#4a9e6e;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.add-save-next-btn:hover{background:#3a8a5e}
.add-save-done-btn{flex:1;padding:12px;background:#f0f5f0;color:#4a7a5e;border:1px solid #c8dcc8;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer}
.add-save-done-btn:hover{background:#e0eee0}

/* ── QUIZ HUB ── */
.hub-cat-header{background:#fff;border:1px solid #dde8dd;border-radius:14px;padding:16px;margin-bottom:13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hub-cat-icon{font-size:30px;flex-shrink:0}
.hub-cat-info{flex:1;min-width:120px}
.hub-cat-name{font-size:17px;font-weight:700;margin-bottom:2px}
.hub-cat-meta{font-size:12px;color:#aaa}
.hub-cat-sel{padding:8px 10px;border:1px solid #d0d8d0;border-radius:10px;font-size:13px;background:#fff;color:#1a1a1a;cursor:pointer;outline:none;-webkit-appearance:none}
.hub-section{background:#fff;border:1px solid #e0e8e0;border-radius:14px;margin-bottom:12px;overflow:hidden}
.hub-section-title{font-size:13px;font-weight:700;color:#444;padding:13px 16px 10px}
.hub-grid{display:grid;grid-template-columns:repeat(2,1fr)}
@media(min-width:500px){.hub-grid.g3{grid-template-columns:repeat(3,1fr)}}
.hub-item{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;transition:background .12s;border-top:1px solid #f2f2ea}
.hub-item:hover{background:#f5fbf7}
.hub-item:active{background:#e8f5ee}
.hub-item-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.hi-red{background:#ffe8e8}.hi-orange{background:#fff3e0}.hi-blue{background:#e8f0ff}
.hi-green{background:#e8faf0}.hi-purple{background:#f0e8ff}.hi-teal{background:#e0f8f4}
.hub-item-body{flex:1;min-width:0}
.hub-item-name{font-size:13px;font-weight:600;margin-bottom:1px}
.hub-item-sub{font-size:11px;color:#bbb}
.hub-arr{color:#ddd;font-size:16px;flex-shrink:0}
.hub-item:hover .hub-arr{color:#4a9e6e}

/* ── SETUP SHEET ── */
.setup-overlay{background:rgba(0,0,0,.45);position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:520px){.setup-overlay{align-items:center;padding:16px}}
.setup-box{background:#fff;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:420px}
@media(min-width:520px){.setup-box{border-radius:18px;padding:24px}}
.setup-box h2{font-size:17px;font-weight:700;margin-bottom:3px}
.setup-sub{font-size:13px;color:#aaa;margin-bottom:16px}

/* ── QUIZ SESSION ── */
.quiz-layout{display:flex;gap:14px;align-items:flex-start}
.quiz-main{flex:1;min-width:0;order:1}
.quiz-sidebar{width:200px;flex-shrink:0;position:sticky;top:66px;display:flex;flex-direction:column;gap:10px;order:2}
.quiz-bc{font-size:13px;color:#aaa;margin-bottom:10px}
.quiz-bc a{color:#4a9e6e;cursor:pointer}
.prog-row{display:flex;justify-content:space-between;font-size:12px;color:#aaa;margin-bottom:5px}
.prog-row strong{color:#1a1a1a}
.pbar{height:5px;background:#e8f0e8;border-radius:3px;margin-bottom:14px}
.pfill{height:5px;background:#4a9e6e;border-radius:3px;transition:width .3s}
.quiz-card{background:#fff;border:1px solid #dde8dd;border-radius:14px;padding:18px 16px;margin-bottom:10px}
.q-header{display:flex;align-items:center;gap:8px;margin-bottom:13px;flex-wrap:wrap}
.q-type-tag{background:#4a9e6e;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.q-num{font-size:13px;color:#aaa}
.q-header-actions{margin-left:auto;display:flex;gap:5px;align-items:center}
.q-star-btn{background:none;border:none;cursor:pointer;font-size:18px;padding:3px 5px;border-radius:8px;line-height:1}
.q-star-btn:hover{background:#fff9e0}
.q-mastered-btn{background:none;border:1px solid #b8e6cc;cursor:pointer;font-size:14px;padding:3px 8px;border-radius:8px;color:#27ae60;line-height:1}
.q-mastered-btn:hover{background:#eafaf2}
.q-mastered-btn.on{background:#eafaf2;border-color:#27ae60}
.q-edit-btn{background:none;border:1px solid #bdd8c8;cursor:pointer;font-size:12px;padding:3px 8px;border-radius:7px;color:#4a9e6e}

<script>
'use strict';

// ═══════════════════════════════════════════════
//  MARKDOWN RENDER
// ═══════════════════════════════════════════════
function renderMd(text){
  if(!text)return '';
  if(typeof marked==='undefined')return escHtml(text).replace(/\n/g,'<br>');
  try{
    marked.setOptions({breaks:true,gfm:true});
    // sanitize: strip <script> etc
    var html=marked.parse(String(text));
    return html.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/on\w+="[^"]*"/gi,'');
  }catch(e){return escHtml(text).replace(/\n/g,'<br>');}
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var esc=escHtml;

// ── TOAST NOTIFICATION ──
var _toastTimer=null;
function showToast(msg,type,duration){
  type=type||'ok';duration=duration||3000;
  var existing=document.getElementById('app-toast');
  if(existing)existing.remove();
  if(_toastTimer)clearTimeout(_toastTimer);
  var el=document.createElement('div');
  el.id='app-toast';el.className='toast '+type;el.textContent=msg;
  document.body.appendChild(el);
  _toastTimer=setTimeout(function(){
    el.style.opacity='0';el.style.transition='opacity .3s';
    setTimeout(function(){if(el.parentNode)el.remove();},300);
  },duration);
}

// ═══════════════════════════════════════════════
//  RICH TEXT EDITOR (contenteditable)
// ═══════════════════════════════════════════════
function buildRTE(id,placeholder,initialHtml,rows){
  rows=rows||4;
  var minH=(rows*1.75*14)+20; // approx
  return '<div class="rte-wrap" id="rte-wrap-'+id+'">'
    +'<div class="rte-toolbar">'
      +'<button class="rte-btn" onmousedown="rteCmd(event,\''+id+'\',\'bold\')" title="粗体"><strong>B</strong></button>'
      +'<button class="rte-btn" onmousedown="rteCmd(event,\''+id+'\',\'italic\')" title="斜体"><em>I</em></button>'
      +'<button class="rte-btn" onmousedown="rteCmd(event,\''+id+'\',\'underline\')" title="下划线"><u>U</u></button>'
      +'<button class="rte-btn" onmousedown="rteSub(event,\''+id+'\')" title="下标">X₂</button>'
      +'<button class="rte-btn" onmousedown="rteSup(event,\''+id+'\')" title="上标">X²</button>'
      +'<button class="rte-btn" onmousedown="rteCode(event,\''+id+'\')" title="行内代码">{ }</button>'
      +'<button class="rte-btn" onmousedown="rteColor(event,\''+id+'\')" title="文字颜色">🎨</button>'
      +'<input type="color" class="color-inp" id="rte-color-'+id+'" value="#e74c3c" oninput="rteApplyColor(\''+id+'\')" onchange="rteApplyColor(\''+id+'\')">'
    +'</div>'
    +'<div class="rte-editor" id="rte-'+id+'" contenteditable="true" data-placeholder="'+placeholder+'" style="min-height:'+minH+'px" oninput="rteSync(\''+id+'\')" onpaste="rtePaste(event,\''+id+'\')">'
      +(initialHtml||'')
    +'</div>'
  +'</div>';
}
function rteGet(id){
  var el=document.getElementById('rte-'+id);
  return el?el.innerHTML:'';
}
function rteGetText(id){
  var el=document.getElementById('rte-'+id);
  return el?el.innerText:'';
}
function rteCmd(e,id,cmd){
  e.preventDefault();
  document.getElementById('rte-'+id).focus();
  document.execCommand(cmd,false,null);
}
function rteSub(e,id){
  e.preventDefault();
  var el=document.getElementById('rte-'+id);el.focus();
  var sel=window.getSelection();
  if(!sel.rangeCount)return;
  var r=sel.getRangeAt(0);
  var sub=document.createElement('sub');
  try{r.surroundContents(sub);}catch(ex){sub.textContent=r.toString();r.deleteContents();r.insertNode(sub);}
  rteSync(id);
}
function rteSup(e,id){
  e.preventDefault();
  var el=document.getElementById('rte-'+id);el.focus();
  var sel=window.getSelection();
  if(!sel.rangeCount)return;
  var r=sel.getRangeAt(0);
  var sup=document.createElement('sup');
  try{r.surroundContents(sup);}catch(ex){sup.textContent=r.toString();r.deleteContents();r.insertNode(sup);}
  rteSync(id);
}
function rteCode(e,id){
  e.preventDefault();
  var el=document.getElementById('rte-'+id);el.focus();
  var sel=window.getSelection();
  if(!sel.rangeCount)return;
  var r=sel.getRangeAt(0);
  var code=document.createElement('code');
  try{r.surroundContents(code);}catch(ex){code.textContent=r.toString();r.deleteContents();r.insertNode(code);}
  rteSync(id);
}
var _savedRange=null;
function rteColor(e,id){
  e.preventDefault();
  // save current selection so it survives the color picker focus shift
  var sel=window.getSelection();
  if(sel&&sel.rangeCount){_savedRange=sel.getRangeAt(0).cloneRange();}else{_savedRange=null;}
  document.getElementById('rte-color-'+id).click();
}
function rteApplyColor(id){
  var color=document.getElementById('rte-color-'+id).value;
  var el=document.getElementById('rte-'+id);
  el.focus();
  // restore saved selection if any
  if(_savedRange){
    var sel=window.getSelection();sel.removeAllRanges();sel.addRange(_savedRange);
  }
  document.execCommand('foreColor',false,color);
  rteSync(id);
}
function rtePaste(e,id){
  e.preventDefault();
  var text=e.clipboardData.getData('text/plain');
  document.execCommand('insertText',false,text);
  rteSync(id);
}
function rteSync(id){} // hook for future live updates

// ═══════════════════════════════════════════════
//  IndexedDB LAYER
// ═══════════════════════════════════════════════
var IDB=(function(){
  var DB_NAME='KnowledgeQuizDB';
  var DB_VER=1;
  var _db=null;
  var _ready=false;
  var _queue=[];

  function open(cb){
    if(_ready){cb(_db);return;}
    _queue.push(cb);
    if(_queue.length>1)return;
    var req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=function(e){
      var db=e.target.result;
      if(!db.objectStoreNames.contains('questions')){
        var qs=db.createObjectStore('questions',{keyPath:'id'});
        qs.createIndex('cat','cat',{unique:false});
        qs.createIndex('starred','starred',{unique:false});
      }
      if(!db.objectStoreNames.contains('cats')){
        db.createObjectStore('cats',{keyPath:'name'});
      }
      if(!db.objectStoreNames.contains('meta')){
        db.createObjectStore('meta',{keyPath:'key'});
      }
    };
    req.onsuccess=function(e){
      _db=e.target.result;_ready=true;
      _queue.forEach(function(fn){fn(_db);});_queue=[];
    };
    req.onerror=function(e){
      console.error('IDB open error',e);
      _queue=[];alert('IndexedDB 初始化失败，请检查浏览器设置（隐私模式下可能不可用）');
    };
  }

  function tx(stores,mode,fn){
    return new Promise(function(resolve,reject){
      open(function(db){
        var t=db.transaction(stores,mode);
        t.onerror=function(e){reject(e);};
        fn(t,resolve,reject);
      });
    });
  }

  var api={
    init:function(cb){open(cb);},

    // ── QUESTIONS ──
    getAllQuestions:function(){
      return new Promise(function(res,rej){
        tx(['questions'],'readonly',function(t,resolve){
          var req=t.objectStore('questions').getAll();
          req.onsuccess=function(){resolve(req.result||[]);};
        }).then(res).catch(function(e){
          showDBError('读取题目失败',e);rej(e);
        });
      });
    },
    addQuestion:function(q){
      return tx(['questions','meta'],'readwrite',function(t,resolve,reject){
        var ms=t.objectStore('meta');
        var gr=ms.get('nextId');
        gr.onsuccess=function(){
          var nid=(gr.result?gr.result.val:1);
          q.id='q'+nid;
          q.wrongCount=q.wrongCount||0;
          q.correctStreak=q.correctStreak||0;
          q.starred=q.starred||false;
          q.mastered=q.mastered||false;
          q.totalAnswered=q.totalAnswered||0;
          var ar=t.objectStore('questions').add(q);
          ar.onerror=function(e){showDBError('保存题目失败',e);reject(e);};
          t.objectStore('meta').put({key:'nextId',val:nid+1});
          resolve(q);
        };
        gr.onerror=function(e){showDBError('获取ID失败',e);reject(e);};
      }).catch(function(e){showDBError('保存题目失败',e);return Promise.reject(e);});
    },
    putQuestion:function(q){
      return tx(['questions'],'readwrite',function(t,resolve,reject){
        var r=t.objectStore('questions').put(q);
        r.onerror=function(e){showDBError('写入题目失败',e);reject(e);};
        resolve(q);
      }).catch(function(e){showDBError('写入题目失败',e);return Promise.reject(e);});
    },
    updateQuestion:function(id,patch){
      return new Promise(function(res,rej){
        tx(['questions'],'readwrite',function(t,resolve,reject){
          var gr=t.objectStore('questions').get(id);
          gr.onsuccess=function(){
            if(!gr.result){resolve(null);return;}
            var q=Object.assign({},gr.result,patch);
            var pr=t.objectStore('questions').put(q);
            pr.onerror=function(e){showDBError('更新题目失败',e);reject(e);};
            resolve(q);
          };
          gr.onerror=function(e){showDBError('查找题目失败',e);reject(e);};
        }).then(res).catch(function(e){rej(e);});
      });
    },
    deleteQuestion:function(id){
      return tx(['questions'],'readwrite',function(t,resolve,reject){
        var r=t.objectStore('questions').delete(id);
        r.onerror=function(e){showDBError('删除题目失败',e);reject(e);};
        resolve();
      }).catch(function(e){showDBError('删除题目失败',e);return Promise.reject(e);});
    },
    getById:function(id){
      return new Promise(function(res,rej){
        tx(['questions'],'readonly',function(t,resolve){
          var r=t.objectStore('questions').get(id);
          r.onsuccess=function(){resolve(r.result||null);};
        }).then(res).catch(rej);
      });
    },

    // ── CATS ──
    getAllCats:function(){
      return new Promise(function(res,rej){
        tx(['cats'],'readonly',function(t,resolve){
          var r=t.objectStore('cats').getAll();
          r.onsuccess=function(){resolve(r.result||[]);};
        }).then(res).catch(function(e){
          showDBError('读取分类失败',e);rej(e);
        });
      });
    },
    addCat:function(cat){
      return tx(['cats'],'readwrite',function(t,resolve,reject){
        var r=t.objectStore('cats').put(cat);
        r.onerror=function(e){showDBError('保存分类失败',e);reject(e);};
        resolve(cat);
      }).catch(function(e){showDBError('保存分类失败',e);return Promise.reject(e);});
    },
    deleteCat:function(name){
      return tx(['cats'],'readwrite',function(t,resolve,reject){
        var r=t.objectStore('cats').delete(name);
        r.onerror=function(e){showDBError('删除分类失败',e);reject(e);};
        resolve();
      }).catch(function(e){showDBError('删除分类失败',e);return Promise.reject(e);});
    },

    // ── IMPORT / EXPORT ──
    exportAll:function(){
      return Promise.all([api.getAllCats(),api.getAllQuestions()]).then(function(r){
        return {version:7,exported:new Date().toISOString(),cats:r[0],questions:r[1]};
      });
    },
    importMerge:function(data){
      return new Promise(function(res,rej){
        Promise.all([api.getAllCats(),api.getAllQuestions()]).then(function(r){
          var existCats=new Set(r[0].map(function(c){return c.name;}));
          var existIds=new Set(r[1].map(function(q){return q.id;}));
          var catPs=(data.cats||[]).filter(function(c){return !existCats.has(c.name);}).map(function(c){return api.addCat(c);});
          var qPs=(data.questions||[]).filter(function(q){return q.id&&!existIds.has(q.id);}).map(function(q){
            q.wrongCount=q.wrongCount||0;q.correctStreak=q.correctStreak||0;
            q.starred=q.starred||false;q.mastered=q.mastered||false;q.totalAnswered=q.totalAnswered||0;
            return api.putQuestion(q);
          });
          var noIdQs=(data.questions||[]).filter(function(q){return !q.id;});
          var addPs=noIdQs.map(function(q){return api.addQuestion(q);});
          return Promise.all(catPs.concat(qPs).concat(addPs));
        }).then(res).catch(function(e){
          showDBError('导入失败，数据可能未完整写入',e);rej(e);
        });
      });
    },
    replaceAll:function(data){
      return new Promise(function(res,rej){
        open(function(db){
          var t=db.transaction(['cats','questions','meta'],'readwrite');
          t.objectStore('cats').clear();
          t.objectStore('questions').clear();
          t.objectStore('meta').clear();
          t.oncomplete=function(){
            var cats=data.cats||[];
            var qs=data.questions||[];
            var maxId=1;
            qs.forEach(function(q){
              if(q.id){var n=parseInt(q.id.replace('q',''));if(!isNaN(n)&&n>=maxId)maxId=n+1;}
            });
            var t2=db.transaction(['cats','questions','meta'],'readwrite');
            t2.onerror=function(e){showDBError('清空数据失败',e);rej(e);};
            cats.forEach(function(c){t2.objectStore('cats').put(c);});
            qs.forEach(function(q){
              q.wrongCount=q.wrongCount||0;q.correctStreak=q.correctStreak||0;
              q.starred=q.starred||false;q.mastered=q.mastered||false;q.totalAnswered=q.totalAnswered||0;
              if(!q.id)q.id='q'+maxId++;
              t2.objectStore('questions').put(q);
            });
            t2.objectStore('meta').put({key:'nextId',val:maxId});
            t2.oncomplete=function(){res();};
          };
          t.onerror=function(e){showDBError('清空数据失败',e);rej(e);};
        });
      });
    }
  };
  return api;
})();

// ── DB ERROR HELPER ──
function showDBError(msg,e){
  var detail=e&&e.target&&e.target.error?e.target.error.message:(e?String(e):'');
  console.error('[DB]',msg,e);
  // non-blocking toast instead of alert for non-critical errors
  showToast('⚠ '+msg+(detail?'：'+detail:''), 'error');
}

    return '<div class="cat-card" onclick="catCardClick(\''+esc(c.name)+'\')">'
      +'<button class="cat-del" onclick="event.stopPropagation();delCat(\''+esc(c.name)+'\')">×</button>'

}

function renderQs(){
  var cat=document.getElementById('filter-cat').value;
  var typeFilter=(document.getElementById('filter-type')||{}).value||'';
  var sortMode=(document.getElementById('sort-qs')||{}).value||'default';
  var keyword=(document.getElementById('search-box').value||'').trim().toLowerCase();
  var sel=document.getElementById('filter-cat');var prev=cat;
  sel.innerHTML='<option value="">全部分类</option>'+_cats.map(function(c){return '<option value="'+esc(c.name)+'">'+c.icon+' '+esc(c.name)+'</option>';}).join('');
  sel.value=prev;
  var qs=_questions.slice();
  if(cat)qs=qs.filter(function(q){return q.cat===cat;});
  if(typeFilter)qs=qs.filter(function(q){return q.type===typeFilter;});
  if(sortMode==='starred')qs=qs.filter(function(q){return q.starred;});
  if(sortMode==='mastered')qs=qs.filter(function(q){return q.mastered;});
  if(sortMode==='wrong-desc')qs.sort(function(a,b){return (b.wrongCount||0)-(a.wrongCount||0);});
  if(sortMode==='wrong-asc')qs.sort(function(a,b){return (a.wrongCount||0)-(b.wrongCount||0);});
  if(keyword)qs=qs.filter(function(q){
    return (q.q||'').toLowerCase().indexOf(keyword)>=0
      ||(q.opts&&q.opts.join(' ').toLowerCase().indexOf(keyword)>=0)
      ||(q.ans||'').toLowerCase().indexOf(keyword)>=0
      ||(q.exp||'').toLowerCase().indexOf(keyword)>=0
      ||(q.id||'').toLowerCase().indexOf(keyword)>=0;
  });
  var l=document.getElementById('q-list');
  if(!qs.length){l.innerHTML='<div class="empty"><div class="empty-icon">📭</div>'+(keyword?'没有匹配的题目':'暂无题目')+'</div>';return;}
  l.innerHTML=qs.map(function(q){
    var isEditing=(editingQId===q.id);
    var masteredBadge=q.mastered?'<span class="q-mastered-badge">✅ 已掌握</span>':'';
    var wrongBadge=q.wrongCount?'<span class="q-wrong-badge">❌'+q.wrongCount+'</span>':'';
    var optsPreview=q.type==='mc'?'<div class="q-opts-preview">'+q.opts.map(function(o,j){return '<span style="'+(j===q.correct?'color:#27ae60;font-weight:600':'')+'">'+(j===q.correct?'✓':String.fromCharCode(65+j))+'. '+esc(o)+'</span>';}).join('  ')+'</div>':'';
    var expPreview=q.exp?'<div class="q-exp-preview">💡 '+esc(q.exp.substring(0,80))+(q.exp.length>80?'…':'')+'</div>':'';
    var editHtml=isEditing?buildInlineEditQ(q):'';
    return '<div class="q-item'+(isEditing?' editing':'')+'" id="qi-'+q.id+'">'
      +'<span class="badge '+(q.type==='mc'?'bmc':'bfill')+'">'+(q.type==='mc'?'选择':'填空')+'</span>'
      +'<div class="q-body">'
        +'<div style="display:flex;align-items:center;gap:5px;margin-bottom:4px;flex-wrap:wrap">'
          +'<span class="q-id">'+q.id+'</span>'
          +'<span class="q-cat-label">'+esc(q.cat)+'</span>'
          +masteredBadge
        +'</div>'
        +'<div class="q-text">'+renderMd(q.q)+'</div>'
        +optsPreview+expPreview+editHtml
      +'</div>'
      +'<div class="q-item-actions">'
        +'<button class="btn-star" onclick="toggleStar(\''+q.id+'\')">'+(q.starred?'⭐':'☆')+'</button>'
        +'<button class="btn-mastered'+(q.mastered?' on':'')+'" onclick="toggleMastered(\''+q.id+'\')" title="已掌握（练习时跳过）">'+( q.mastered?'✅':'☑')+'</button>'
        +'<button class="btn-edit" onclick="toggleInlineEdit(\''+q.id+'\')">'+(isEditing?'取消':'编辑')+'</button>'
        +'<button class="btn-del" onclick="delQ(\''+q.id+'\')">删除</button>'
      +'</div></div>';
  }).join('');
}

function buildInlineEditQ(q){
  var catOpts=_cats.map(function(c){return '<option value="'+esc(c.name)+'"'+(c.name===q.cat?' selected':'')+'>'+c.icon+' '+esc(c.name)+'</option>';}).join('');
  var optsHtml='';
  if(q.type==='mc'){

  }

function saveInlineEdit(id,type){
  var newQ=rteGet('ie-q');

  var newExp=(document.getElementById('ie-exp')||{}).value||'';

  if(type==='mc'){
    var opts=Array.from(document.querySelectorAll('#ie-ol input[type=text]')).map(function(i){return i.value.trim();});

function hitem(cls,icon,name,sub,onclick){return '<div class="hub-item" onclick="'+onclick+'"><div class="hub-item-icon '+cls+'">'+icon+'</div><div class="hub-item-body"><div class="hub-item-name">'+name+'</div><div class="hub-item-sub">'+sub+'</div></div><span class="hub-arr">›</span></div>';}
function hubSetCat(val){hubCat=val;renderQuizHub();}

// 按题型分组：选择题全部在前，填空题全部在后
// 各组内部保持原有顺序（随机/顺序由外层决定）
// 「题型练习」模式选了单一类型时不需要分组，直接跳过
function groupByType(pool, mode){
  // 题型练习已经是单一类型，不分组
  if(mode==='type') return pool;
  var mc=pool.filter(function(q){return q.type==='mc';});
  var fill=pool.filter(function(q){return q.type!=='mc';});
  return mc.concat(fill);
}

function launchSpecial(mode){
  var pool=hubCat?_questions.filter(function(q){return q.cat===hubCat;}):_questions.slice();
  if(mode==='wrong')pool=pool.filter(function(q){return q.wrongCount&&q.wrongCount>0;});
  if(mode==='star')pool=pool.filter(function(q){return q.starred;});
  if(!pool.length){alert(mode==='wrong'?'暂无错题，继续加油！':'暂无收藏，去收藏几题吧～');return;}
  // 每种类型内部随机打乱，再分组
  pool=pool.slice().sort(function(){return Math.random()-.5;});
  pool=groupByType(pool, mode);
  beginSession(pool,mode);
}

function openSetup(mode){
  var pool=hubCat?_questions.filter(function(q){return q.cat===hubCat&&!q.mastered;}):_questions.filter(function(q){return !q.mastered;});
  var label={ordered:'顺序练习',random:'随机练习',type:'题型练习'}[mode];
  var typeRow=mode==='type'?'<div class="fr"><label>题目类型</label><select id="qz-type" style="width:100%"><option value="">全部</option><option value="mc">仅选择题</option><option value="fill">仅填空题</option></select></div>':'';
  var shRow=mode!=='ordered'?'<div class="ck-row"><input type="checkbox" id="sh-q" checked><label for="sh-q">打乱题目顺序</label></div>':'';
  document.getElementById('quiz-setup').innerHTML=
    '<div class="setup-overlay" onclick="if(event.target===this)closeSetup()"><div class="setup-box"><h2>'+label+'</h2>'
      +'<div class="setup-sub">'+(hubCat||'全部题库')+' · 可练 '+pool.length+' 道</div>'
      +typeRow
      +'<div class="fr"><label>题目数量</label><select id="qz-cnt" style="width:100%"><option value="5">5 题</option><option value="10" selected>10 题</option><option value="20">20 题</option><option value="0">全部（'+pool.length+' 题）</option></select></div>'
      +shRow
      +'<div class="ck-row"><input type="checkbox" id="sh-o" checked><label for="sh-o">打乱选项顺序</label></div>'
      +'<div style="display:flex;gap:9px;margin-top:16px"><button class="btn-o" style="flex:1" onclick="closeSetup()">取消</button>'
        +'<button class="btn-p" style="flex:2" onclick="startFromSetup(\''+mode+'\')">开始练习</button></div>'
    +'</div></div>';
  document.getElementById('quiz-setup').classList.remove('hidden');
}
function closeSetup(){document.getElementById('quiz-setup').classList.add('hidden');}

function startFromSetup(mode){
  var pool=hubCat?_questions.filter(function(q){return q.cat===hubCat&&!q.mastered;}):_questions.filter(function(q){return !q.mastered;});
  var te=document.getElementById('qz-type');
  if(te&&te.value)pool=pool.filter(function(q){return q.type===te.value;});
  if(!pool.length){alert('暂无符合条件的题目');return;}
  var shq=document.getElementById('sh-q');
  pool=shq&&shq.checked?pool.slice().sort(function(){return Math.random()-.5;}):pool.slice();
  var cnt=parseInt(document.getElementById('qz-cnt').value)||pool.length;
  pool=pool.slice(0,Math.min(cnt,pool.length));
  if(document.getElementById('sh-o').checked){
    pool=pool.map(function(q){
      if(q.type!=='mc')return q;
      var idx=q.opts.map(function(_,i){return i;}).sort(function(){return Math.random()-.5;});
      return Object.assign({},q,{opts:idx.map(function(i){return q.opts[i];}),correct:idx.indexOf(q.correct)});
    });
  }
  closeSetup();
  pool=groupByType(pool, mode);
  beginSession(pool,mode);
}

function beginSession(pool,mode){
  qz={qs:pool,cur:0,score:0,ans:new Array(pool.length).fill(null),mode:mode,inlineEdit:false,
      wrongList:[],correctList:[]};
  document.getElementById('quiz-hub').classList.add('hidden');
  document.getElementById('quiz-session').classList.remove('hidden');
  renderSession();
}

// ═══════════════════════════════════════════════
//  QUIZ SESSION
// ═══════════════════════════════════════════════
function renderSession(){
  if(qz.cur>=qz.qs.length){showResult();return;}
  var q=qz.qs[qz.cur];
  var done=qz.ans[qz.cur]!==null;
  var answN=qz.ans.filter(function(a){return a!==null;}).length;
  var pct=Math.round(answN/qz.qs.length*100);

  var qbody='';
  if(qz.inlineEdit){
    qbody=buildQuizEditArea(q);
  }else if(q.type==='mc'){
    qbody='<div class="opts-list">'+q.opts.map(function(o,i){
      var cls='opt-btn';
      if(done){if(i===q.correct)cls+=' oc';else if(i===qz.ans[qz.cur])cls+=' ow';}
      return '<button class="'+cls+'"'+(done?' disabled':'')+' onclick="ansMC('+i+')">'
        +'<span class="opt-key">'+String.fromCharCode(65+i)+'</span><span>'+esc(o)+'</span></button>';
    }).join('')+'</div>';
  }else{
    var fv=done&&qz.ans[qz.cur]!=='__empty__'?esc(qz.ans[qz.cur]):'';
    var fc=done?(qz.ans[qz.cur]&&qz.ans[qz.cur].trim().toLowerCase()===q.ans.trim().toLowerCase()?' fc':' fw'):'';
    qbody='<div class="fill-wrap"><input class="fill-inp'+fc+'" id="fi" value="'+fv+'"'+(done?' disabled':'')+' placeholder="输入答案，回车确认">'
      +(done?'':'<button class="confirm-btn" onclick="ansFill()">确认</button>')+'</div>';
  }

  var fb='';
  if(done){
    var isOk=q.type==='mc'?qz.ans[qz.cur]===q.correct:(qz.ans[qz.cur]!=='__empty__'&&qz.ans[qz.cur].trim().toLowerCase()===q.ans.trim().toLowerCase());
    var as=q.type==='fill'?esc(q.ans):(String.fromCharCode(65+q.correct)+' — '+esc(q.opts[q.correct]));
    fb='<div class="feedback '+(isOk?'ok':'fail')+'">'+(isOk?'✓ 回答正确！':'✗ 正确答案：<strong>'+as+'</strong>')+'</div>';
    if(q.exp)fb+='<div class="q-explanation"><strong>💡 解析</strong><div>'+renderMd(q.exp)+'</div></div>';
  }

  // stats
  var ta=q.totalAnswered||0,wc=q.wrongCount||0,rate=ta>0?Math.round((ta-wc)/ta*100):null;
  var statsHtml='<div class="q-stats-row"><span class="stat-chip">回答 '+ta+' 次</span><span class="stat-chip sc-err">错误 '+wc+' 次</span><span class="stat-chip sc-ok">正确率 '+(rate!==null?rate+'%':'—')+'</span></div>';

  // answer card
  var mcDots='',fillDots='',mcIdx=0,fillIdx=0;
  qz.qs.forEach(function(qq,i){
    var cls='ans-dot';
    if(i===qz.cur)cls+=' cur';
    else if(qz.ans[i]!==null){
      var q2=qz.qs[i];
      var ok2=q2.type==='mc'?qz.ans[i]===q2.correct:(qz.ans[i]!=='__empty__'&&qz.ans[i].trim().toLowerCase()===q2.ans.trim().toLowerCase());
      cls+=ok2?' dok':' dfail';
    }
    if(qq.type==='mc'){
      mcIdx++;
      mcDots+='<button class="'+cls+'" onclick="jumpTo('+i+')" title="选择题第'+mcIdx+'题">'+mcIdx+'</button>';
    }else{
      fillIdx++;
      fillDots+='<button class="'+cls+'" onclick="jumpTo('+i+')" title="填空题第'+fillIdx+'题">'+fillIdx+'</button>';
    }
  });

  // 计算当前题在组内的位置
  var mcTotal=qz.qs.filter(function(x){return x.type==='mc';}).length;
  var fillTotal=qz.qs.filter(function(x){return x.type!=='mc';}).length;
  var groupPos=q.type==='mc'
    ? qz.qs.slice(0,qz.cur+1).filter(function(x){return x.type==='mc';}).length
    : qz.qs.slice(0,qz.cur+1).filter(function(x){return x.type!=='mc';}).length;
  var groupTotal=q.type==='mc'?mcTotal:fillTotal;
  var qNumText=groupPos+'/'+groupTotal+(groupTotal<qz.qs.length?'（'+(q.type==='mc'?'选':'填')+'）':'');

function toggleQuizEdit(){qz.inlineEdit=!qz.inlineEdit;renderSession();}
function saveQuizEdit(){
  var q=qz.qs[qz.cur];
  var newQ=document.getElementById('qe-q').value.trim();if(!newQ){alert('题目不能为空');return;}
  var newCat=document.getElementById('qe-cat').value;
  var newExp=(document.getElementById('qe-exp')||{}).value||'';
  var patch={q:newQ,cat:newCat,exp:newExp.trim()};
  if(q.type==='mc'){
    var opts=Array.from(document.querySelectorAll('#qe-ol input[type=text]')).map(function(i){return i.value.trim();});
    var cor=parseInt(document.querySelector('input[name=qe-cor]:checked').value);
    patch.opts=opts;patch.correct=cor;q.opts=opts;q.correct=cor;
  }else{
    var ans=document.getElementById('qe-ans').value.trim();if(!ans){alert('请输入答案');return;}patch.ans=ans;q.ans=ans;
  }
  q.q=newQ;q.cat=newCat;q.exp=newExp.trim();
  IDB.updateQuestion(q.id,patch).then(function(){qz.inlineEdit=false;renderSession();});
}

function inSessionStar(){

}
function inSessionMastered(){
  var q=qz.qs[qz.cur];
  IDB.updateQuestion(q.id,{mastered:!q.mastered}).then(function(updated){if(updated)q.mastered=updated.mastered;renderSession();reloadQ(function(){});});

function ansMC(i){
  if(qz.ans[qz.cur]!==null)return;
  qz.ans[qz.cur]=i;
  var q=qz.qs[qz.cur];
  var newTotal=(q.totalAnswered||0)+1;
  if(i===q.correct){
    qz.score++;q.totalAnswered=newTotal;
    qz.correctList.push(qz.cur);
    var newStreak=(q.correctStreak||0)+1;
    IDB.updateQuestion(q.id,{correctStreak:newStreak,totalAnswered:newTotal}).then(function(updated){
      if(updated){
        var thresh=CFG.get('wrongThreshold')||2;
        var neverRemove=CFG.get('wrongNeverRemove');
        if(!neverRemove&&thresh>0&&newStreak>=thresh&&(updated.wrongCount||0)>0){
          IDB.updateQuestion(q.id,{wrongCount:0,correctStreak:0});
          reloadQ(function(){});
        }
      }
    });
    if(CFG.get('autoNext')&&qz.cur+1<qz.qs.length){
      var btns=document.querySelectorAll('.opt-btn');
      if(btns[i])btns[i].classList.add('oc');
      setTimeout(function(){nextQ();},650);
      return;
    }
  }else{
    qz.wrongList.push(qz.cur);
    q.wrongCount=(q.wrongCount||0)+1;q.totalAnswered=newTotal;q.correctStreak=0;
    IDB.updateQuestion(q.id,{wrongCount:q.wrongCount,correctStreak:0,totalAnswered:newTotal});
  }
  renderSession();
}

function ansFill(){
  var el=document.getElementById('fi');var v=el?el.value.trim():'';
  qz.ans[qz.cur]=v||'__empty__';
  var q=qz.qs[qz.cur];
  var newTotal=(q.totalAnswered||0)+1;
  var ok=(v&&v.toLowerCase()===q.ans.trim().toLowerCase());
  if(ok){
    qz.score++;q.totalAnswered=newTotal;
    qz.correctList.push(qz.cur);
    var newStreak=(q.correctStreak||0)+1;
    IDB.updateQuestion(q.id,{correctStreak:newStreak,totalAnswered:newTotal}).then(function(updated){
      if(updated){
        var thresh=CFG.get('wrongThreshold')||2;
        var neverRemove=CFG.get('wrongNeverRemove');
        if(!neverRemove&&thresh>0&&newStreak>=thresh&&(updated.wrongCount||0)>0){
          IDB.updateQuestion(q.id,{wrongCount:0,correctStreak:0});
          reloadQ(function(){});
        }
      }
    });
    if(CFG.get('autoNext')&&qz.cur+1<qz.qs.length){
      setTimeout(function(){nextQ();},650);
      return;
    }
  }else{
    qz.wrongList.push(qz.cur);
    q.wrongCount=(q.wrongCount||0)+1;q.totalAnswered=newTotal;q.correctStreak=0;
    IDB.updateQuestion(q.id,{wrongCount:q.wrongCount,correctStreak:0,totalAnswered:newTotal});
  }
  renderSession();
}

var _reviewOpen=null; // 'ok' | 'fail' | null
function showReview(type){
  var panel=document.getElementById('review-panel');if(!panel)return;
  // toggle: clicking same type again collapses
  if(_reviewOpen===type){
    _reviewOpen=null;panel.innerHTML='';
    // reset arrow indicators
    document.querySelectorAll('.stat-c.clickable .stat-l').forEach(function(el){
      el.textContent=el.textContent.replace(' ▴',' ▾');
    });
    return;
  }
  _reviewOpen=type;
  // update arrow on clicked card
  document.querySelectorAll('.stat-c.clickable').forEach(function(el){
    var lbl=el.querySelector('.stat-l');if(!lbl)return;
    var isThis=(type==='ok'&&lbl.textContent.indexOf('答对')>=0)||(type==='fail'&&lbl.textContent.indexOf('答错')>=0);
    lbl.textContent=lbl.textContent.replace(' ▾',' ▴').replace(' ▴','').replace(/ ▾/,'');
    lbl.textContent+=(isThis?' ▴':' ▾');
  });
  var indices=type==='ok'?qz.correctList:qz.wrongList;
  if(!indices.length){panel.innerHTML='<div style="text-align:center;padding:16px;color:#aaa;font-size:13px">'+(type==='ok'?'本次无答对':'本次无答错')+'</div>';return;}
  var items=indices.map(function(i){
    var q=qz.qs[i];
    var userAns=qz.ans[i];
    var isOk=q.type==='mc'?userAns===q.correct:(userAns!=='__empty__'&&userAns.trim().toLowerCase()===q.ans.trim().toLowerCase());
    var correctTxt=q.type==='fill'?q.ans:(String.fromCharCode(65+q.correct)+'. '+q.opts[q.correct]);
    var userTxt=q.type==='fill'?(userAns==='__empty__'?'（未作答）':userAns):(userAns<q.opts.length?String.fromCharCode(65+userAns)+'. '+q.opts[userAns]:'？');
    return '<div class="review-item">'
      +'<div class="ri-label">'+esc(q.cat)+' · '+q.id+'</div>'
      +'<div class="ri-q">'+renderMd(q.q)+'</div>'
      +'<div class="ri-ans">'
        +(!isOk?'<span class="ri-wrong">你的答案：'+esc(userTxt)+'</span>':'')
        +'<span class="ri-correct">✓ '+esc(correctTxt)+'</span>'
      +'</div>'
    +'</div>';
  }).join('');
  panel.innerHTML='<div class="review-list"><div class="review-list-title">'+(type==='ok'?'✅ 答对的题目':'❌ 答错的题目')+'（'+indices.length+' 道）</div>'+items+'</div>';
}

function formatBytes(bytes){
  if(bytes<1024)return bytes+'B';
  if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' KB';
  return (bytes/1024/1024).toFixed(2)+' MB';
}

function calcStorage(){
  return IDB.exportAll().then(function(data){
    // measure JSON serialization size as byte estimate
    var jsonStr=JSON.stringify(data);
    // UTF-8: most CJK chars = 3 bytes, ASCII = 1 byte
    var bytes=0;
    for(var i=0;i<jsonStr.length;i++){
      var c=jsonStr.charCodeAt(i);
      if(c<0x80)bytes+=1;
      else if(c<0x800)bytes+=2;
      else bytes+=3;
    }
    var usedKB=bytes/1024;
    var result={usedKB:usedKB,qCount:data.questions.length,catCount:data.cats.length,quotaMB:null};

    // try StorageManager API for actual quota
    if(navigator.storage&&navigator.storage.estimate){
      return navigator.storage.estimate().then(function(est){
        result.quotaMB=est.quota?(est.quota/1024/1024):null;
        // override usedKB with actual browser-reported usage if available
        if(est.usage&&est.usage>0) result.usedKB=est.usage/1024;
        return result;
      }).catch(function(){return result;});
    }
    return Promise.resolve(result);
  });
}
function onGlobalThreshChange(val){
  val=parseInt(val)||0;
  if(val===0){CFG.set('wrongNeverRemove',true);}else{CFG.set('wrongNeverRemove',false);CFG.set('wrongThreshold',val);}
}

function clearAllData(){
  if(!confirm('⚠ 清空全部数据\n\n此操作会删除所有题目和分类，且不可撤销。\n\n点确定后会先自动导出一份备份，\n然后再执行清空。'))return;
  // Step 1: force export first
  IDB.exportAll().then(function(data){
    var now=new Date();
    var pad=function(n){return String(n).padStart(2,'0');};
    var ts=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())
      +'_'+pad(now.getHours())+'-'+pad(now.getMinutes())+'-'+pad(now.getSeconds());
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='清空前备份_'+ts+'.json';a.click();

    // Step 2: confirm again after download triggered
    setTimeout(function(){
      if(!confirm('备份已下载。\n\n确认清空全部数据？'))return;
      IDB.replaceAll({cats:[],questions:[]}).then(function(){
        loadAll(function(){
          renderCats();
          renderSettingsPage();
          showToast('已清空全部数据', 'info');
        });
      }).catch(function(e){
        alert('清空失败：'+(e&&e.message?e.message:String(e)));
      });
    }, 800);
  }).catch(function(e){
    alert('备份导出失败，为安全起见取消清空操作。\n错误：'+(e&&e.message?e.message:String(e)));
  });
}

function exportData(){
  IDB.exportAll().then(function(data){
    var now=new Date();
    var pad=function(n){return String(n).padStart(2,'0');};
    var ts=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())
      +'_'+pad(now.getHours())+'-'+pad(now.getMinutes())+'-'+pad(now.getSeconds());
    var json=JSON.stringify(data,null,2);
    var blob=new Blob([json],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='知识题库_'+ts+'.json';a.click();
    showToast('✓ 已导出 '+data.questions.length+' 道题', 'info');
  }).catch(function(e){
    alert('导出失败：'+(e&&e.message?e.message:String(e)));
  });
}
function importData(inp){
  var f=inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);

      // ── 结构校验 ──
      if(!Array.isArray(data.cats)||!Array.isArray(data.questions)){
        alert('文件格式有误：缺少 cats 或 questions 字段。\n请确认是本系统导出的 JSON。');return;
      }

      // ── 版本提示（向后兼容，不阻断，仅提示）──
      var fileVer=data.version||0;
      var currentVer=7;
      if(fileVer>currentVer){
        if(!confirm('该文件版本（v'+fileVer+'）高于当前系统（v'+currentVer+'），部分新字段可能丢失。\n确定继续导入？'))return;
      }

      // ── 字段完整性检查：抽样前5题 ──
      var badQs=data.questions.slice(0,5).filter(function(q){
        return !q.type||!q.cat||!q.q;
      });
      if(badQs.length>0){
        if(!confirm('发现 '+badQs.length+' 道题目缺少必要字段（type/cat/q），这些题目将跳过。\n确定继续？'))return;
        data.questions=data.questions.filter(function(q){return q.type&&q.cat&&q.q;});
      }

      var msg='导入 '+data.cats.length+' 个分类、'+data.questions.length+' 道题？\n按 ID 合并，已有题目不重复导入。';
      if(!confirm(msg))return;

      IDB.importMerge(data).then(function(){
        loadAll(function(){
          renderCats();
          showToast('✓ 导入成功：'+data.questions.length+' 道题', 'info', 3000);
        });
      }).catch(function(e){
        alert('导入过程中发生错误，数据可能未完整写入，建议重新导入。\n错误：'+(e&&e.message?e.message:String(e)));
      });

    }catch(x){
      alert('JSON 解析失败，文件可能已损坏。\n'+x);
    }
  };
  r.onerror=function(){alert('文件读取失败，请重试。');};
  r.readAsText(f);inp.value='';
}
