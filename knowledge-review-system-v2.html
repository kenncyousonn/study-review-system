<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="知识复习">
<title>知识复习系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f7f0;color:#1a1a1a;font-size:15px;min-height:100vh}

/* ===== SHARED ===== */
.app{max-width:1100px;margin:0 auto;min-height:100vh}
.hidden{display:none!important}
.btn-p{padding:10px 22px;background:#4a9e6e;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:background 0.15s}
.btn-p:hover{background:#3a8a5e}
.btn-o{padding:9px 18px;border:1px solid #ccc;border-radius:10px;font-size:14px;cursor:pointer;background:#fff;color:#444}
.btn-o:hover{background:#f5f5f5}
.btn-ghost{padding:8px 16px;border:1px solid #bdd8c8;border-radius:8px;font-size:13px;cursor:pointer;background:#fff;color:#4a9e6e;font-weight:500}
.btn-ghost:hover{background:#eaf5f0}

/* ===== NAV BAR ===== */
.navbar{background:#fff;border-bottom:1px solid #e0e0d8;padding:0 16px;display:flex;align-items:center;gap:8px;height:50px;position:sticky;top:0;z-index:20}
.nav-logo{font-size:20px}
.nav-title{font-size:16px;font-weight:600;color:#1a1a1a;flex:1}
.nav-tabs{display:flex;gap:2px}
.nav-tab{padding:6px 14px;border:none;background:transparent;font-size:14px;cursor:pointer;color:#888;border-radius:8px;font-weight:500}
.nav-tab.active{background:#eaf5f0;color:#2a7a4e}
.nav-actions{display:flex;gap:6px;margin-left:8px}
.nav-btn{padding:6px 12px;border:1px solid #d0d0c8;border-radius:8px;font-size:13px;cursor:pointer;background:#fff;color:#555}
.nav-btn:hover{background:#f5f5f5}

/* ===== CONTENT AREA ===== */
.content{padding:20px 16px}

/* ===== CATEGORY PAGE ===== */
.sec-title{font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.cat-card{background:#fff;border:1px solid #e0e8e0;border-radius:14px;padding:16px 14px;cursor:pointer;position:relative;transition:all 0.15s}
.cat-card:hover{border-color:#4a9e6e;box-shadow:0 2px 10px rgba(74,158,110,0.12)}
.cat-del{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.06);border:none;border-radius:6px;cursor:pointer;color:#666;font-size:13px;width:22px;height:22px;display:none;align-items:center;justify-content:center}
.cat-card:hover .cat-del{display:flex}
.cat-icon{font-size:26px;margin-bottom:8px}
.cat-name{font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:3px}
.cat-count{font-size:12px;color:#999}
.add-cat-btn{border:1.5px dashed #c8dcc8;border-radius:14px;padding:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:#999;font-size:13px;background:transparent;width:100%}
.add-cat-btn:hover{border-color:#4a9e6e;color:#4a9e6e}

/* ===== QUESTION LIST PAGE ===== */
.toolbar{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.sel{padding:8px 10px;border:1px solid #d0d8d0;border-radius:10px;font-size:13px;background:#fff;color:#1a1a1a;cursor:pointer;outline:none}
.sel:focus{border-color:#4a9e6e}
.ml-auto{margin-left:auto;display:flex;gap:6px}
.q-list{display:flex;flex-direction:column;gap:8px}
.q-item{background:#fff;border:1px solid #e8e8e0;border-radius:12px;padding:13px;display:flex;gap:10px;align-items:flex-start}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.bmc{background:#e8f4ff;color:#2266cc}
.bfill{background:#e8f8ee;color:#1a7a45}
.q-body{flex:1;min-width:0}
.q-cat-label{font-size:11px;color:#aaa;margin-bottom:3px}
.q-text{font-size:14px;color:#1a1a1a;line-height:1.5}
.btn-del{padding:5px 10px;border:1px solid #ffd0d0;border-radius:8px;font-size:12px;cursor:pointer;background:#fff;color:#c0392b;flex-shrink:0}
.btn-del:hover{background:#fff0f0}
.empty{text-align:center;padding:40px 20px;color:#bbb;font-size:14px}
.empty-icon{font-size:40px;margin-bottom:10px}

/* ===== QUIZ LAYOUT ===== */
.quiz-layout{display:flex;gap:16px;align-items:flex-start}
.quiz-main{flex:1;min-width:0}
.quiz-sidebar{width:220px;flex-shrink:0;position:sticky;top:70px}

/* quiz breadcrumb */
.quiz-breadcrumb{font-size:13px;color:#888;margin-bottom:14px;display:flex;align-items:center;gap:4px}
.quiz-breadcrumb a{color:#4a9e6e;cursor:pointer;text-decoration:none}
.quiz-breadcrumb a:hover{text-decoration:underline}

/* quiz card */
.quiz-card{background:#fff;border:1px solid #dde8dd;border-radius:16px;padding:24px;margin-bottom:14px}
.q-header{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.q-type-tag{background:#4a9e6e;color:#fff;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.q-number{font-size:14px;font-weight:600;color:#888}
.q-body-text{font-size:16px;line-height:1.7;font-weight:500;color:#1a1a1a;margin-bottom:20px}
.opts-list{display:flex;flex-direction:column;gap:10px}
.opt-btn{text-align:left;padding:13px 16px;border:1.5px solid #e0e8e0;border-radius:12px;cursor:pointer;background:#fff;font-size:15px;color:#1a1a1a;line-height:1.5;font-family:inherit;width:100%;display:flex;align-items:flex-start;gap:10px;transition:all 0.15s}
.opt-btn:hover:not(:disabled){border-color:#4a9e6e;background:#f0faf4}
.opt-btn:disabled{cursor:default}
.opt-key{font-weight:600;flex-shrink:0;color:#888}
.opt-btn:hover:not(:disabled) .opt-key{color:#4a9e6e}
.opt-btn.oc{border-color:#27ae60;background:#eafaf2;color:#1a6a35}
.opt-btn.oc .opt-key{color:#27ae60}
.opt-btn.ow{border-color:#e74c3c;background:#fef0ef;color:#a93226}
.opt-btn.ow .opt-key{color:#e74c3c}
.fill-inp{width:100%;padding:13px 16px;border:1.5px solid #d8e8d8;border-radius:12px;font-size:15px;background:#fff;color:#1a1a1a;font-family:inherit;outline:none;transition:border-color 0.15s}
.fill-inp:focus{border-color:#4a9e6e;box-shadow:0 0 0 3px rgba(74,158,110,0.1)}
.fill-inp.fc{border-color:#27ae60;background:#eafaf2;color:#1a6a35}
.fill-inp.fw{border-color:#e74c3c;background:#fef0ef;color:#a93226}
.feedback{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:14px;line-height:1.5}
.feedback.ok{background:#eafaf2;color:#1a6a35;border:1px solid #b8e6cc}
.feedback.fail{background:#fef0ef;color:#a93226;border:1px solid #f5c0ba}
.feedback strong{font-weight:600}

/* quiz nav buttons */
.quiz-nav-btns{display:flex;gap:10px;margin-top:6px}
.nav-prev,.nav-next{padding:10px 20px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;border:1.5px solid #ccdccc}
.nav-prev{background:#fff;color:#444}
.nav-prev:hover{background:#f5f5f5}
.nav-next{background:#4a9e6e;color:#fff;border-color:#4a9e6e}
.nav-next:hover{background:#3a8a5e}
.nav-next:disabled{background:#aaa;border-color:#aaa;cursor:default}

/* answer card sidebar */
.ans-card{background:#fff;border:1px solid #dde8dd;border-radius:14px;padding:16px}
.ans-card-title{font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.ans-card-reset{font-size:12px;color:#4a9e6e;cursor:pointer;font-weight:400}
.ans-card-reset:hover{text-decoration:underline}
.ans-section-label{font-size:12px;color:#888;margin:10px 0 6px}
.ans-grid{display:flex;flex-wrap:wrap;gap:6px}
.ans-dot{width:34px;height:34px;border-radius:8px;border:1.5px solid #d8e8d8;background:#fff;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#555;transition:all 0.15s}
.ans-dot:hover{border-color:#4a9e6e;color:#4a9e6e}
.ans-dot.current{border-color:#4a9e6e;background:#4a9e6e;color:#fff;box-shadow:0 0 0 2px rgba(74,158,110,0.25)}
.ans-dot.done-ok{border-color:#27ae60;background:#eafaf2;color:#27ae60}
.ans-dot.done-fail{border-color:#e74c3c;background:#fef0ef;color:#e74c3c}
.ans-dot.done-any{border-color:#4a9e6e;background:#c8e8d8;color:#1a5a35}
.ans-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#888}
.legend-dot{width:12px;height:12px;border-radius:3px}

/* progress bar */
.progress-area{margin-bottom:20px}
.prog-row{display:flex;justify-content:space-between;font-size:13px;color:#888;margin-bottom:6px}
.prog-row strong{color:#1a1a1a;font-weight:600}
.pbar{height:6px;background:#e8f0e8;border-radius:3px}
.pfill{height:6px;background:#4a9e6e;border-radius:3px;transition:width 0.3s}

/* result */
.result-page{text-align:center;padding:30px 20px;max-width:520px;margin:0 auto}
.result-emoji{font-size:56px;margin-bottom:10px}
.result-pct{font-size:60px;font-weight:700;color:#4a9e6e;line-height:1}
.result-sublabel{font-size:14px;color:#888;margin-top:6px;margin-bottom:24px}
.stat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}
.stat-c{background:#fff;border:1px solid #e8e8e0;border-radius:12px;padding:14px;text-align:center}
.stat-num{font-size:26px;font-weight:700;margin-bottom:2px}
.stat-lbl{font-size:12px;color:#888}
.stat-c.ok .stat-num{color:#27ae60}
.stat-c.fail .stat-num{color:#e74c3c}
.stat-c.total .stat-num{color:#4a9e6e}
.result-btns{display:flex;gap:10px;justify-content:center}
.result-btns .btn-p,.result-btns .btn-o{flex:1;max-width:180px;text-align:center}

/* quiz setup */
.quiz-setup-card{background:#fff;border:1px solid #dde8dd;border-radius:16px;padding:24px;max-width:420px}
.quiz-setup-card h2{font-size:17px;font-weight:600;margin-bottom:18px}
.fr{margin-bottom:14px}
.fr label{display:block;font-size:13px;font-weight:500;color:#555;margin-bottom:5px}
input[type=text],textarea,select{width:100%;padding:10px 12px;border:1px solid #d0d8d0;border-radius:10px;font-size:14px;background:#fff;color:#1a1a1a;font-family:inherit;outline:none;transition:border-color 0.15s}
input[type=text]:focus,textarea:focus,select:focus{border-color:#4a9e6e;box-shadow:0 0 0 3px rgba(74,158,110,0.1)}
textarea{min-height:70px;resize:vertical;line-height:1.5}
.ck-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ck-row input[type=checkbox]{width:17px;height:17px;accent-color:#4a9e6e;cursor:pointer;flex-shrink:0}
.ck-row label{font-size:14px;color:#1a1a1a;cursor:pointer}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:100}
@media(min-width:520px){.modal-overlay{align-items:center;padding:16px}}
.modal-box{background:#fff;border-radius:20px 20px 0 0;padding:20px 18px 32px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto}
@media(min-width:520px){.modal-box{border-radius:18px;padding:22px}}
.modal-box h2{font-size:17px;font-weight:600;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-actions .btn-p{flex:2}
.modal-actions .btn-o{flex:1}
.opt-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.opt-row input[type=text]{flex:1}
.opt-del-btn{background:none;border:none;cursor:pointer;color:#bbb;font-size:18px;line-height:1;padding:0 4px}
.opt-del-btn:hover{color:#e74c3c}
.radio-cor{accent-color:#4a9e6e;width:18px;height:18px;flex-shrink:0;cursor:pointer}
.icon-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.icon-btn{font-size:24px;background:none;border:2px solid transparent;border-radius:8px;cursor:pointer;padding:4px 6px}
.icon-btn.sel{border-color:#4a9e6e}
.icon-btn:hover{border-color:#aaa}
.add-opt-btn{font-size:13px;color:#4a9e6e;background:none;border:1px solid #b8dcc8;border-radius:8px;padding:6px 12px;cursor:pointer;margin-top:2px}
.add-opt-btn:hover{background:#eaf5f0}

/* confirm-fill btn */
.confirm-btn{margin-top:10px;padding:10px 22px;background:#4a9e6e;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.confirm-btn:hover{background:#3a8a5e}

/* ===== ADD PAGE ===== */
.add-page-wrap{max-width:680px}
.add-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.add-badge{background:#eaf5f0;color:#2a7a4e;font-size:13px;font-weight:600;padding:5px 14px;border-radius:20px;border:1px solid #b8e0cc}
.add-meta-row{display:flex;gap:12px;margin-bottom:14px}
.add-card{background:#fff;border:1px solid #dde8dd;border-radius:16px;padding:22px 20px;margin-bottom:16px}
.add-card .fr:last-child{margin-bottom:0}
.req{color:#e74c3c;margin-right:2px}
.add-opts-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.add-opts-header label{margin-bottom:0}
.add-opt-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;padding:10px 12px;border:1px solid #e8eee8;border-radius:10px;background:#fafcfa;transition:border-color 0.15s}
.add-opt-row:focus-within{border-color:#4a9e6e;background:#f5fbf7}
.add-opt-letter{font-weight:700;color:#555;font-size:14px;width:18px;flex-shrink:0}
.add-radio{accent-color:#4a9e6e;width:17px;height:17px;flex-shrink:0;cursor:pointer}
.add-opt-inp{flex:1;border:none;background:transparent;font-size:14px;color:#1a1a1a;font-family:inherit;outline:none;padding:0}
.add-opt-del{background:none;border:none;cursor:pointer;font-size:15px;opacity:0.4;flex-shrink:0;padding:0 2px}
.add-opt-del:hover{opacity:1}
.add-add-opt-btn{font-size:13px;color:#4a9e6e;background:none;border:1px dashed #b8dcc8;border-radius:8px;padding:7px 14px;cursor:pointer;margin-top:4px;width:100%;text-align:center}
.add-add-opt-btn:hover{background:#eaf5f0}
.add-ans-row{display:flex;gap:16px;flex-wrap:wrap;padding:10px 14px;border:1px solid #e0e8e0;border-radius:10px;background:#fafcfa}
.add-ans-lbl{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:500;cursor:pointer;color:#444}
.add-actions{display:flex;gap:10px}
.add-save-next-btn{flex:2;padding:12px 0;background:#4a9e6e;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:background 0.2s}
.add-save-next-btn:hover{background:#3a8a5e}
.add-save-done-btn{flex:1;padding:12px 0;background:#f0f5f0;color:#4a7a5e;border:1px solid #c8dcc8;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer}
.add-save-done-btn:hover{background:#e0eee0}
@media(max-width:680px){.add-actions{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <!-- navbar -->
  <div class="navbar">
    <div class="nav-logo">🎓</div>
    <div class="nav-title">知识复习系统</div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('cats')">分类</button>
      <button class="nav-tab" onclick="switchTab('questions')">题库</button>
      <button class="nav-tab" onclick="switchTab('add')">录题</button>
      <button class="nav-tab" onclick="switchTab('quiz')">练习</button>
    </div>
    <div class="nav-actions">
      <button class="nav-btn" onclick="exportData()">⬇ 导出</button>
      <label class="nav-btn" style="cursor:pointer">⬆ 导入<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label>
    </div>
  </div>

  <div class="content">

    <!-- CATEGORIES -->
    <div id="pg-cats" class="page active">
      <div class="sec-title">我的分类</div>
      <div class="cat-grid" id="cat-grid"></div>
      <button class="add-cat-btn" onclick="openAddCat()">＋ 新建分类</button>
    </div>

    <!-- QUESTIONS -->
    <div id="pg-questions" class="page hidden">
      <div class="toolbar">
        <select class="sel" id="filter-cat" onchange="renderQs()"><option value="">全部分类</option></select>
        <div class="ml-auto">
          <button class="btn-ghost" onclick="openAddQ('mc')">＋ 选择题</button>
          <button class="btn-ghost" onclick="openAddQ('fill')">＋ 填空题</button>
        </div>
      </div>
      <div class="q-list" id="q-list"></div>
    </div>

    <!-- ADD QUESTIONS PAGE -->
    <div id="pg-add" class="page hidden">
      <div id="add-page-inner"></div>
    </div>

    <!-- QUIZ SETUP -->
    <div id="pg-quiz" class="page hidden">
      <div id="quiz-setup">
        <div class="quiz-setup-card">
          <h2>开始练习</h2>
          <div class="fr"><label>选择分类</label><select id="qz-cat" style="width:100%"><option value="">全部分类</option></select></div>
          <div class="fr"><label>题目数量</label>
            <select id="qz-cnt" style="width:100%">
              <option value="5">5 题</option>
              <option value="10" selected>10 题</option>
              <option value="20">20 题</option>
              <option value="0">全部</option>
            </select>
          </div>
          <div class="ck-row"><input type="checkbox" id="sh-q" checked><label for="sh-q">打乱题目顺序</label></div>
          <div class="ck-row"><input type="checkbox" id="sh-o" checked><label for="sh-o">打乱选项顺序（选择题）</label></div>
          <button class="btn-p" style="width:100%;margin-top:8px" onclick="startQuiz()">开始练习</button>
        </div>
      </div>
      <div id="quiz-session" class="hidden"></div>
      <div id="quiz-result" class="hidden"></div>
    </div>

  </div>
</div>

<!-- modal -->
<div id="modal" style="display:none" class="modal-overlay" onclick="if(event.target===this)closeModal()"></div>

<script>
var db = JSON.parse(localStorage.getItem('kqdb2') || '{"cats":[],"questions":[]}');
if (!db.cats) db = { cats: [], questions: [] };
var qz = {};
var ICONS = ['📘','🐍','🌿','⚙️','🎯','🔐','📊','🗄️','🌐','🔧','💡','🧪','🎨','📐','🔬','🏃'];

function save() { localStorage.setItem('kqdb2', JSON.stringify(db)); }

// ===== TABS =====
function switchTab(t) {
  var names = ['cats', 'questions', 'add', 'quiz'];
  document.querySelectorAll('.nav-tab').forEach(function(b,i){ b.classList.toggle('active', names[i]===t); });
  names.forEach(function(n){
    var p = document.getElementById('pg-' + n);
    p.classList.toggle('active', n===t);
    p.classList.toggle('hidden', n!==t);
  });
  if (t==='questions') renderQs();
  if (t==='quiz') syncQuizCats();
  if (t==='cats') renderCats();
  if (t==='add') renderAddPage();
}

// ===== CATEGORIES =====
function renderCats() {
  var g = document.getElementById('cat-grid');
  if (!db.cats.length) {
    g.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📂</div>还没有分类，点下面新建</div>';
    return;
  }
  g.innerHTML = db.cats.map(function(c,i){
    var cnt = db.questions.filter(function(q){ return q.cat===c.name; }).length;
    return '<div class="cat-card" onclick="goToQs(\''+esc(c.name)+'\')">'
      +'<button class="cat-del" onclick="event.stopPropagation();delCat('+i+')" title="删除">×</button>'
      +'<div class="cat-icon">'+c.icon+'</div>'
      +'<div class="cat-name">'+esc(c.name)+'</div>'
      +'<div class="cat-count">'+cnt+' 题</div>'
      +'</div>';
  }).join('');
}

function goToQs(name) { switchTab('questions'); document.getElementById('filter-cat').value=name; renderQs(); }

function delCat(i){ if(!confirm('删除分类？')) return; db.cats.splice(i,1); save(); renderCats(); }

function openAddCat(){
  var iconBtns = ICONS.map(function(ic,idx){
    return '<button class="icon-btn'+(idx===0?' sel':'')+'" data-ic="'+ic+'" onclick="pickIcon(\''+ic+'\')">'+ic+'</button>';
  }).join('');
  showModal('<h2>新建分类</h2>'
    +'<div class="fr"><label>分类名称</label><input type="text" id="mn" placeholder="例：Python 基础"></div>'
    +'<div class="fr"><label>选择图标</label><div class="icon-grid" id="ig">'+iconBtns+'</div><input type="text" id="mi" value="📘" style="display:none"></div>'
    +'<div class="modal-actions"><button class="btn-o" onclick="closeModal()">取消</button><button class="btn-p" onclick="addCat()">创建</button></div>');
  setTimeout(function(){ var el=document.getElementById('mn'); if(el) el.focus(); },60);
}

function pickIcon(ic){
  document.getElementById('mi').value=ic;
  document.querySelectorAll('.icon-btn').forEach(function(b){ b.classList.toggle('sel', b.dataset.ic===ic); });
}

function addCat(){
  var name=document.getElementById('mn').value.trim();
  if(!name){ alert('请输入名称'); return; }
  if(db.cats.find(function(c){ return c.name===name; })){ alert('分类已存在'); return; }
  db.cats.push({name:name,icon:document.getElementById('mi').value||'📘'});
  save(); closeModal(); renderCats();
}

// ===== QUESTIONS =====
function renderQs(){
  var cat=document.getElementById('filter-cat').value;
  var sel=document.getElementById('filter-cat');
  var prev=cat;
  sel.innerHTML='<option value="">全部分类</option>'+db.cats.map(function(c){ return '<option value="'+esc(c.name)+'">'+c.icon+' '+esc(c.name)+'</option>'; }).join('');
  sel.value=prev;
  var qs=cat ? db.questions.filter(function(q){ return q.cat===cat; }) : db.questions;
  var l=document.getElementById('q-list');
  if(!qs.length){ l.innerHTML='<div class="empty"><div class="empty-icon">📭</div>暂无题目</div>'; return; }
  l.innerHTML=qs.map(function(q){
    var ri=db.questions.indexOf(q);
    return '<div class="q-item">'
      +'<span class="badge '+(q.type==='mc'?'bmc':'bfill')+'">'+(q.type==='mc'?'选择':'填空')+'</span>'
      +'<div class="q-body"><div class="q-cat-label">'+esc(q.cat)+'</div><div class="q-text">'+esc(q.q)+'</div></div>'
      +'<button class="btn-del" onclick="delQ('+ri+')">删除</button>'
      +'</div>';
  }).join('');
}

function openAddQ(type){
  if(!db.cats.length){ alert('请先创建分类！'); return; }
  var catOpts=db.cats.map(function(c){ return '<option>'+esc(c.name)+'</option>'; }).join('');
  var extra = type==='mc'
    ? '<div class="fr"><label>选项（左边单选框 = 正确答案）</label>'
      +'<div id="ol">'+[0,1,2,3].map(function(i){
          return '<div class="opt-row"><input type="radio" name="cor" value="'+i+'" class="radio-cor"'+(i===0?' checked':'')+'>'
            +'<input type="text" placeholder="选项 '+String.fromCharCode(65+i)+'" id="op-'+i+'">'
            +'<button class="opt-del-btn" onclick="remOpt(this)">×</button></div>';
        }).join('')+'</div>'
      +'<button class="add-opt-btn" onclick="addOpt()">＋ 加选项</button></div>'
    : '<div class="fr"><label>参考答案（判断时忽略大小写）</label><input type="text" id="mans" placeholder="标准答案"></div>';
  showModal('<h2>'+(type==='mc'?'添加选择题':'添加填空题')+'</h2>'
    +'<div class="fr"><label>所属分类</label><select id="mcat">'+catOpts+'</select></div>'
    +'<div class="fr"><label>题目内容</label><textarea id="mq" placeholder="在此输入题目..."></textarea></div>'
    +extra
    +'<div class="modal-actions"><button class="btn-o" onclick="closeModal()">取消</button><button class="btn-p" onclick="saveQ(\''+type+'\')">保存题目</button></div>');
}

function addOpt(){
  var l=document.getElementById('ol'); var n=l.children.length;
  var d=document.createElement('div'); d.className='opt-row';
  d.innerHTML='<input type="radio" name="cor" value="'+n+'" class="radio-cor"><input type="text" placeholder="选项 '+String.fromCharCode(65+n)+'" id="op-'+n+'"><button class="opt-del-btn" onclick="remOpt(this)">×</button>';
  l.appendChild(d);
}

function remOpt(btn){ if(btn.parentElement.parentElement.children.length>2) btn.parentElement.remove(); }

function saveQ(type){
  var cat=document.getElementById('mcat').value;
  var q=document.getElementById('mq').value.trim();
  if(!q){ alert('请输入题目'); return; }
  if(type==='mc'){
    var opts=Array.from(document.querySelectorAll('#ol input[type=text]')).map(function(i){ return i.value.trim(); }).filter(Boolean);
    if(opts.length<2){ alert('至少2个选项'); return; }
    var cor=parseInt(document.querySelector('input[name=cor]:checked').value);
    if(cor>=opts.length){ alert('请确认正确答案在有效选项内'); return; }
    db.questions.push({type:'mc',cat:cat,q:q,opts:opts,correct:cor});
  } else {
    var ans=document.getElementById('mans').value.trim();
    if(!ans){ alert('请输入答案'); return; }
    db.questions.push({type:'fill',cat:cat,q:q,ans:ans});
  }
  save(); closeModal(); renderQs();
}

function delQ(i){ if(!confirm('删除该题？')) return; db.questions.splice(i,1); save(); renderQs(); }

// ===== ADD PAGE (连续录题) =====
var addState = { savedCount: 0 };

    document.getElementById('add-page-inner').innerHTML =
      '<div class="empty"><div class="empty-icon">📂</div>请先在「分类」页面新建分类，再来录题。'

    ? '<div class="add-saved-toast" id="saved-toast">✓ 已保存 '+addState.savedCount+' 道题</div>' : '';
  document.getElementById('add-page-inner').innerHTML =

    // header row
    +'<div class="add-header">'
      +'<div>'
        +'<h2 style="font-size:17px;font-weight:600;margin-bottom:2px">录题</h2>'
        +'<div style="font-size:13px;color:#888">保存后自动清空，可连续录入</div>'
      +'</div>'
      +(addState.savedCount>0?'<div class="add-badge">已录 '+addState.savedCount+' 题</div>':'')
    +'</div>'
    // category + count row
    +'<div class="add-meta-row">'
      +'<div class="fr" style="flex:1;margin-bottom:0"><label>所属分类</label>'
        +'<select id="add-cat" style="width:100%">'+catOpts+'</select>'
      +'</div>'
    +'</div>'
    // question body
    +'<div class="add-card">'
      +'<div class="fr"><label><span class="req">*</span> 题目内容</label>'
        +'<textarea id="add-q" placeholder="在此输入题目..." rows="3"></textarea>'
      +'</div>'
      // options
      +'<div class="fr">'
        +'<div class="add-opts-header"><label><span class="req">*</span> 试题选项</label><span style="font-size:12px;color:#888">点左侧单选框设为正确答案</span></div>'
        +'<div id="add-ol">'
          +[0,1,2,3].map(function(i){
            return '<div class="add-opt-row">'
              +'<span class="add-opt-letter">'+String.fromCharCode(65+i)+'</span>'
              +'<input type="radio" name="add-cor" value="'+i+'" class="add-radio"'+(i===0?' checked':'')+'>'
              +'<input type="text" class="add-opt-inp" placeholder="请输入试题选项" id="aop-'+i+'">'
              +'<button class="add-opt-del" onclick="addRemOpt(this)" title="删除">🗑</button>'
              +'</div>';
          }).join('')
        +'</div>'
        +'<button class="add-add-opt-btn" onclick="addAddOpt()">＋ 添加选项</button>'
      +'</div>'
      // answer display
      +'<div class="fr">'
        +'<label><span class="req">*</span> 答案</label>'
        +'<div class="add-ans-row" id="add-ans-row">'
          +[0,1,2,3].map(function(i){
            return '<label class="add-ans-lbl">'
              +'<input type="radio" name="add-cor2" value="'+i+'"'+(i===0?' checked':'')+' onchange="syncAns('+i+')" style="accent-color:#4a9e6e">'
              +' '+String.fromCharCode(65+i)+'</label>';
          }).join('')
        +'</div>'
        +'<div style="font-size:12px;color:#aaa;margin-top:4px">与上方选项单选框同步</div>'
      +'</div>'
      // explanation (optional)
      +'<div class="fr">'
        +'<label>解析 <span style="color:#bbb;font-weight:400">(选填)</span></label>'

      +'</div>'

    // action buttons

    +'</div>'

  // sync radio groups

function syncAns(i) {
  // bottom answer row → sync top radios
  var r=document.querySelector('input[name=add-cor][value="'+i+'"]');
  if(r) r.checked=true;
}
function syncAns2(i) {
  // top opt radios → sync bottom answer row
  var r=document.querySelector('input[name=add-cor2][value="'+i+'"]');
  if(r) r.checked=true;
}

function addAddOpt(){
  var l=document.getElementById('add-ol');
  var n=l.children.length;
  if(n>=8) return;
  var d=document.createElement('div'); d.className='add-opt-row';
  d.innerHTML='<span class="add-opt-letter">'+String.fromCharCode(65+n)+'</span>'
    +'<input type="radio" name="add-cor" value="'+n+'" class="add-radio">'
    +'<input type="text" class="add-opt-inp" placeholder="请输入试题选项" id="aop-'+n+'">'
    +'<button class="add-opt-del" onclick="addRemOpt(this)" title="删除">🗑</button>';
  l.appendChild(d);
  // also add to answer row
  var ar=document.getElementById('add-ans-row');
  var lbl=document.createElement('label'); lbl.className='add-ans-lbl';
  lbl.innerHTML='<input type="radio" name="add-cor2" value="'+n+'" onchange="syncAns('+n+')" style="accent-color:#4a9e6e"> '+String.fromCharCode(65+n);
  ar.appendChild(lbl);
  // add change listener
  d.querySelector('input[type=radio]').addEventListener('change', function(){ syncAns2(n); });
}

function addRemOpt(btn){
  var l=document.getElementById('add-ol');
  if(l.children.length<=2) return;
  btn.parentElement.remove();
  // rebuild letters + values
  Array.from(l.children).forEach(function(row,i){
    row.querySelector('.add-opt-letter').textContent=String.fromCharCode(65+i);
    var r=row.querySelector('input[type=radio]'); r.value=i;
    r.onchange=null; r.addEventListener('change',function(){ syncAns2(i); });
  });
  // rebuild answer row
  var ar=document.getElementById('add-ans-row');
  ar.innerHTML=Array.from(l.children).map(function(row,i){
    return '<label class="add-ans-lbl"><input type="radio" name="add-cor2" value="'+i+'"'+(i===0?' checked':'')+' onchange="syncAns('+i+')" style="accent-color:#4a9e6e"> '+String.fromCharCode(65+i)+'</label>';
  }).join('');
}

function collectAddForm(){
  var cat=document.getElementById('add-cat').value;
  var q=document.getElementById('add-q').value.trim();
  if(!q){ alert('请输入题目内容'); document.getElementById('add-q').focus(); return null; }
  var opts=Array.from(document.querySelectorAll('#add-ol .add-opt-inp')).map(function(i){ return i.value.trim(); });
  var filled=opts.filter(Boolean);
  if(filled.length<2){ alert('至少填写 2 个选项'); return null; }
  // remap correct index to filled opts
  var cor=parseInt(document.querySelector('input[name=add-cor]:checked').value);
  // if cor opt is empty, find first non-empty
  if(!opts[cor]){ alert('正确答案对应的选项内容为空，请检查'); return null; }
  var finalOpts=opts.filter(Boolean);
  // cor might shift if earlier opts were empty — use text match
  var corText=opts[cor];
  var finalCor=finalOpts.indexOf(corText);
  var exp=document.getElementById('add-exp').value.trim();
  return {type:'mc',cat:cat,q:q,opts:finalOpts,correct:finalCor,exp:exp||''};
}

function saveAndContinue(){
  var data=collectAddForm();
  if(!data) return;
  db.questions.push(data);
  save();
  addState.savedCount++;
  // show brief flash then re-render
  var btn=document.querySelector('.add-save-next-btn');
  if(btn){ btn.textContent='✓ 已保存！'; btn.style.background='#27ae60'; }
  setTimeout(function(){
    // preserve selected category
    var cat=document.getElementById('add-cat').value;
    renderAddPage();
    var s=document.getElementById('add-cat'); if(s) s.value=cat;
    document.getElementById('add-q').focus();
  }, 480);
}

function saveAndDone(){
  var data=collectAddForm();
  if(!data) return;
  db.questions.push(data);
  save();
  addState.savedCount++;
  var total=addState.savedCount;
  addState.savedCount=0;
  alert('✓ 录题完成，共保存 '+total+' 道题！');
  switchTab('questions');
}


function syncQuizCats(){
  var s=document.getElementById('qz-cat'); var v=s.value;
  s.innerHTML='<option value="">全部分类</option>'+db.cats.map(function(c){ return '<option value="'+esc(c.name)+'">'+c.icon+' '+esc(c.name)+'</option>'; }).join('');
  s.value=v;
}

function startQuiz(){
  var cat=document.getElementById('qz-cat').value;
  var qs=cat ? db.questions.filter(function(q){ return q.cat===cat; }) : db.questions.slice();
  if(!qs.length){ alert('该分类暂无题目！'); return; }
  qs=qs.slice();
  if(document.getElementById('sh-q').checked) qs.sort(function(){ return Math.random()-0.5; });
  var cnt=parseInt(document.getElementById('qz-cnt').value)||qs.length;
  qs=qs.slice(0,Math.min(cnt,qs.length));
  if(document.getElementById('sh-o').checked){
    qs=qs.map(function(q){
      if(q.type!=='mc') return q;
      var idx=q.opts.map(function(_,i){ return i; }).sort(function(){ return Math.random()-0.5; });
      return Object.assign({},q,{opts:idx.map(function(i){ return q.opts[i]; }),correct:idx.indexOf(q.correct)});
    });
  }
  qz={qs:qs,cur:0,score:0,ans:new Array(qs.length).fill(null)};
  document.getElementById('quiz-setup').classList.add('hidden');
  document.getElementById('quiz-result').classList.add('hidden');
  document.getElementById('quiz-session').classList.remove('hidden');
  renderSession();
}

// ===== QUIZ SESSION =====
function renderSession(){
  var q=qz.qs[qz.cur];
  var done=qz.ans[qz.cur]!==null;
  var pct=Math.round(qz.qs.filter(function(_,i){ return qz.ans[i]!==null; }).length/qz.qs.length*100);
  
  // main question html
  var qbody='';
  if(q.type==='mc'){
    qbody='<div class="opts-list">'+q.opts.map(function(o,i){
      var cls='opt-btn';
      if(done){ if(i===q.correct) cls+=' oc'; else if(i===qz.ans[qz.cur]) cls+=' ow'; }
      return '<button class="'+cls+'"'+(done?' disabled':'')+' onclick="ansMC('+i+')">'
        +'<span class="opt-key">'+String.fromCharCode(65+i)+'</span>'
        +'<span>'+esc(o)+'</span>'
        +'</button>';
    }).join('')+'</div>';
  } else {
    var fv=done?esc(qz.ans[qz.cur]):'';
    var fc=done?(qz.ans[qz.cur].trim().toLowerCase()===q.ans.trim().toLowerCase()?' fc':' fw'):'';
    qbody='<input class="fill-inp'+fc+'" id="fi" value="'+fv+'"'+(done?' disabled':'')+' placeholder="在此输入答案...">';
    if(!done) qbody+='<br><button class="confirm-btn" onclick="ansFill()">确认答案</button>';
  }

  var fb='';
  if(done){
    var ok=q.type==='mc' ? qz.ans[qz.cur]===q.correct : qz.ans[qz.cur].trim().toLowerCase()===q.ans.trim().toLowerCase();
    var ans_show=q.type==='fill'?esc(q.ans):(String.fromCharCode(65+q.correct)+' — '+esc(q.opts[q.correct]));
    fb='<div class="feedback '+(ok?'ok':'fail')+'">'+(ok?'✓ 回答正确！':'✗ 正确答案：<strong>'+ans_show+'</strong>')+'</div>';
  }

  // answer card dots
  var mcQs=[], fillQs=[];
  qz.qs.forEach(function(q,i){
    var entry={i:i,n:i+1};
    if(q.type==='mc') mcQs.push(entry); else fillQs.push(entry);
  });

  function dotHtml(entry){
    var i=entry.i; var n=entry.n;
    var cls='ans-dot';
    if(i===qz.cur) cls+=' current';
    else if(qz.ans[i]!==null){
      var q2=qz.qs[i];
      var ok2=q2.type==='mc'?qz.ans[i]===q2.correct:qz.ans[i].trim().toLowerCase()===q2.ans.trim().toLowerCase();
      cls+=ok2?' done-ok':' done-fail';
    }
    return '<button class="'+cls+'" onclick="jumpTo('+i+')" title="第'+(i+1)+'题">'+n+'</button>';
  }

  var mcSection = mcQs.length ? '<div class="ans-section-label">单选题</div><div class="ans-grid">'+mcQs.map(dotHtml).join('')+'</div>' : '';
  var fillSection = fillQs.length ? '<div class="ans-section-label">填空题</div><div class="ans-grid">'+fillQs.map(dotHtml).join('')+'</div>' : '';

  var answered=qz.ans.filter(function(a){ return a!==null; }).length;

  document.getElementById('quiz-session').innerHTML =
    '<div class="quiz-breadcrumb">'
    +'<a onclick="resetQuiz()">首页</a> / '
    +(qz.qs[0]?'<a>'+esc(qz.qs[0].cat)+'</a> / ':'')
    +'随机练习'
    +'</div>'
    +'<div class="progress-area">'
    +'<div class="prog-row"><span>完成进度</span><strong>'+answered+' / '+qz.qs.length+' 题</strong></div>'
    +'<div class="pbar"><div class="pfill" style="width:'+pct+'%"></div></div>'
    +'</div>'
    +'<div class="quiz-layout">'
      +'<div class="quiz-main">'
        +'<div class="quiz-card">'
          +'<div class="q-header">'
            +'<span class="q-type-tag">'+(q.type==='mc'?'单选题':'填空题')+'</span>'
            +'<span class="q-number">'+(qz.cur+1)+' / '+qz.qs.length+'</span>'
          +'</div>'
          +'<div class="q-body-text">'+esc(q.q)+'</div>'
          +qbody
          +fb
        +'</div>'
        +'<div class="quiz-nav-btns">'
          +'<button class="nav-prev" onclick="prevQ()"'+(qz.cur===0?' disabled':'')+'>← 上一题</button>'
          +(done
            ? '<button class="nav-next" onclick="nextQ()">'+(qz.cur+1<qz.qs.length?'下一题 →':'查看结果')+'</button>'
            : '<button class="nav-next" disabled>下一题 →</button>')
        +'</div>'
      +'</div>'
      +'<div class="quiz-sidebar">'
        +'<div class="ans-card">'
          +'<div class="ans-card-title">答题卡 <span class="ans-card-reset" onclick="resetQuiz()">重新练习</span></div>'
          +mcSection+fillSection
          +'<div class="ans-legend">'
            +'<div class="legend-item"><div class="legend-dot" style="background:#4a9e6e"></div>当前题</div>'
            +'<div class="legend-item"><div class="legend-dot" style="background:#eafaf2;border:1px solid #27ae60"></div>答对</div>'
            +'<div class="legend-item"><div class="legend-dot" style="background:#fef0ef;border:1px solid #e74c3c"></div>答错</div>'
          +'</div>'
        +'</div>'
      +'</div>'
    +'</div>';

  if(q.type==='fill'&&!done){
    setTimeout(function(){
      var el=document.getElementById('fi');
      if(el){ el.focus(); el.onkeydown=function(e){ if(e.key==='Enter') ansFill(); }; }
    },40);
  }
}

function ansMC(i){
  if(qz.ans[qz.cur]!==null) return;
  qz.ans[qz.cur]=i;
  if(i===qz.qs[qz.cur].correct) qz.score++;
  renderSession();
}

function ansFill(){
  var v=document.getElementById('fi').value;
  if(!v.trim()) return;
  qz.ans[qz.cur]=v;
  if(v.trim().toLowerCase()===qz.qs[qz.cur].ans.trim().toLowerCase()) qz.score++;
  renderSession();
}

function jumpTo(i){ qz.cur=i; renderSession(); }
function prevQ(){ if(qz.cur>0){ qz.cur--; renderSession(); } }

function nextQ(){
  if(qz.cur+1<qz.qs.length){ qz.cur++; renderSession(); }
  else showResult();
}

function showResult(){
  document.getElementById('quiz-session').classList.add('hidden');
  var pct=Math.round(qz.score/qz.qs.length*100);
  var emoji=pct>=90?'🎉':pct>=70?'👍':pct>=50?'💪':'📖';
  document.getElementById('quiz-result').innerHTML=
    '<div class="result-page">'
    +'<div class="result-emoji">'+emoji+'</div>'
    +'<div class="result-pct">'+pct+'%</div>'
    +'<div class="result-sublabel">本次练习得分</div>'
    +'<div class="stat-cards">'
      +'<div class="stat-c ok"><div class="stat-num">'+qz.score+'</div><div class="stat-lbl">✅ 答对</div></div>'
      +'<div class="stat-c fail"><div class="stat-num">'+(qz.qs.length-qz.score)+'</div><div class="stat-lbl">❌ 答错</div></div>'
      +'<div class="stat-c total"><div class="stat-num">'+qz.qs.length+'</div><div class="stat-lbl">📋 共计</div></div>'
    +'</div>'
    +'<div class="result-btns">'
      +'<button class="btn-o" onclick="resetQuiz()">返回设置</button>'
      +'<button class="btn-p" onclick="startQuiz()">再练一次</button>'
    +'</div>'
    +'</div>';
  document.getElementById('quiz-result').classList.remove('hidden');
}

function resetQuiz(){
  document.getElementById('quiz-setup').classList.remove('hidden');
  document.getElementById('quiz-session').classList.add('hidden');
  document.getElementById('quiz-result').classList.add('hidden');
}

// ===== IMPORT / EXPORT =====
function exportData(){
  var blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='知识题库_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}

function importData(inp){
  var f=inp.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.cats||!data.questions) throw 0;
      if(!confirm('导入 '+data.cats.length+' 个分类，'+data.questions.length+' 道题？（将与现有数据合并）')) return;
      var en=new Set(db.cats.map(function(c){ return c.name; }));
      data.cats.forEach(function(c){ if(!en.has(c.name)) db.cats.push(c); });
      db.questions=db.questions.concat(data.questions);
      save(); renderCats(); alert('导入成功！');
    }catch(x){ alert('文件格式有误'); }
  };
  r.readAsText(f); inp.value='';
}

// ===== MODAL =====
function showModal(html){ var m=document.getElementById('modal'); m.style.display='flex'; m.innerHTML='<div class="modal-box">'+html+'</div>'; }
function closeModal(){ document.getElementById('modal').style.display='none'; }

// ===== UTILS =====
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
